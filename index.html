    <title>November 2026 Angels Camp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 1.8225rem;}
      /* Fast tapping must never trigger the browser's double-tap
         zoom — matters most on the present cards, which are
         tapped rapidly to break them open. */
      button, [role="button"], summary, a { touch-action: manipulation;}
      * { box-sizing: border-box;}
      b, strong{ font-weight:400; }
      :root{
        --bg:#FAF6EC; --bg-grad:#F2ECDB;
        --surface:#FFFFFF; --surface-2:#F6F1E3; --surface-3:#EBE3CF;
        --ink:#2B2620; --ink-soft:#49433A; --muted:#7A7261;
        --line:#E2D9C4;
        /* Friendly accent family — muted & warm, used by meaning */
        --accent:#B35A36; --accent-strong:#8F4527; --accent-soft:#F7E6DC;
        --now-fill:#A6502E;
        --sage:#5F7A45; --sage-strong:#3E5627; --sage-bg:#EBF1DE; --sage-line:#B7C99E;
        --mustard:#C08A12; --mustard-strong:#7A5510; --mustard-bg:#FBF0D0; --mustard-line:#E2C26C;
        --rose:#B2595A; --rose-strong:#8F3E40; --rose-bg:#F9E9E5;
        --teal:#3F7A74; --teal-strong:#2C5A55; --teal-bg:#E1EFEC; --teal-line:#AFD0C9;
        --amber:#D9A62E;
        --chip-bg:var(--sage-bg); --chip-ink:var(--sage-strong); --chip-line:var(--sage-line);
        --mine-bg:var(--sage-bg); --mine-line:#8FA96F; --mine-ink:var(--sage-strong);
        --youth:var(--teal-strong); --youth-bg:var(--teal-bg);
        --parents:var(--rose-strong); --parents-bg:var(--rose-bg);
        --now-ring:#B35A36;
        --gold:#DFA92E; --gold-ink:#3D2C05;
        --shadow:0 8px 24px rgba(70,64,55,.10);
        --shadow-lg:0 14px 34px rgba(70,64,55,.16);
        --radius:17.82px;}
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#242220; --bg-grad:#2C2925;
          --surface:#2E2B27; --surface-2:#36322C; --surface-3:#403B34;
          --ink:#F4F1E9; --ink-soft:#DFDAD0; --muted:#B9B3A6;
          --line:#4B463D;
          --accent:#DE8F66; --accent-strong:#EBAB87; --accent-soft:#3D2A20;
          --now-fill:#9A4A28;
          --sage:#A9C48A; --sage-strong:#CFE3B0; --sage-bg:#2E3C21; --sage-line:#5C7442;
          --mustard:#EFC25E; --mustard-strong:#F2CE7E; --mustard-bg:#40331A; --mustard-line:#7A5F22;
          --rose:#E5A3A0; --rose-strong:#EFB9B5; --rose-bg:#3E2825;
          --teal:#8FC4BC; --teal-strong:#A9D6CF; --teal-bg:#213936; --teal-line:#3E5F5A;
          --amber:#EFB254;
          --chip-bg:var(--sage-bg); --chip-ink:var(--sage-strong); --chip-line:var(--sage-line);
          --mine-bg:var(--sage-bg); --mine-line:#7E9A5C; --mine-ink:#D3E4B4;
          --youth:var(--teal-strong); --youth-bg:var(--teal-bg);
          --parents:var(--rose-strong); --parents-bg:var(--rose-bg);
          --now-ring:#DE8F66;
          --gold:#DFA92E; --gold-ink:#2E2104;
          --shadow:0 8px 24px rgba(0,0,0,.38);
          --shadow-lg:0 14px 34px rgba(0,0,0,.48);}
      }
      html{ scroll-behavior:smooth;}
      body{
        margin:0; color:var(--ink); line-height:1.45;
        font-family:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
        background:linear-gradient(180deg, var(--bg-grad) 0, var(--bg) 260px, var(--bg) 100%);
        background-color:var(--bg);
        -webkit-font-smoothing:antialiased;}
      :focus-visible{ outline:3px solid var(--accent); outline-offset:2px; border-radius:4.86px;}
      button{ transition:background-color .15s ease, border-color .15s ease, color .15s ease;}
      .wrap{ max-width:880px; margin:0 auto; padding:9.41px 12.96px 21.51px;}
      @media (min-width:640px){ .wrap{ padding:12.1px 16.2px 25.55px;} }

      /* ---------- Camp header ---------- */
      .camp-head{ padding:2.69px 1.62px 0;}
      .camp-head h1{ font-size:clamp(1.2575rem, 5.4vw, 1.6767rem); font-weight:900; letter-spacing:-.01em; margin:0; line-height:1.15;}
      .welcome-line{ font-size:0.7627rem; font-weight:400; color:var(--ink-soft); margin:5.38px 1.62px 0; line-height:1.4;}

      /* ---------- Section headings ---------- */
      .section-h{ font-size:1.0228rem; font-weight:900; margin:13.45px 1.62px 4.71px; line-height:1.2; color:var(--ink); letter-spacing:-.01em;}
      .section-h:first-child{ margin-top:5.38px;}
      .section-h .section-h-sub{ display:block; font-size:0.8667rem; font-weight:400; color:var(--muted); margin-top:1.34px; letter-spacing:0;}
      .now-resp-card{ background:var(--sage-bg); border:1px solid var(--sage-line); border-radius:var(--radius); padding:4.03px 11.34px 5.38px;}
      .now-resp-empty{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:6.72px 11.34px; font-weight:400; color:var(--muted); line-height:1.45;}
      .day-resp{ background:var(--sage-bg); border:1px solid var(--sage-line); border-radius:12.96px; padding:6.05px 9.72px 4.03px; margin:0 0 6.72px;}
      .day-resp h3{ font-size:0.7974rem; font-weight:900; margin:0 0 2.69px; color:var(--sage-strong);}
      .day-resp-none{ font-weight:400; color:var(--muted); margin:0 0 2.69px; font-size:0.7627rem;}
      .day-resp .plain-duty{ border-top-color:var(--sage-line);}
      .now-assign-card{ background:var(--mustard-bg); border:1px solid var(--mustard-line); border-radius:var(--radius); padding:4.03px 11.34px 5.38px;}
      .now-assign-card .plain-duty{ border-top-color:var(--mustard-line);}
      .day-assign{ background:var(--mustard-bg); border:1px solid var(--mustard-line); border-radius:12.96px; padding:6.05px 9.72px 4.03px; margin:0 0 6.72px;}
      .day-assign h3{ font-size:0.7974rem; font-weight:900; margin:0 0 2.69px; color:var(--mustard-strong);}
      .day-assign .plain-duty{ border-top-color:var(--mustard-line);}
      .group-card{ background:var(--mustard-bg); border:2px solid var(--mustard-line); border-radius:var(--radius); padding:8.07px 11.34px; margin-top:8.07px;}
      .group-card h2{ font-size:1.0228rem; font-weight:900; margin:0 0 2.69px;}
      .group-card p{ margin:1.34px 0; font-weight:400; color:var(--ink-soft); line-height:1.45;}
      .group-card p b{ color:var(--ink);}

      /* ---------- Identity bar (quiet page footer) ---------- */
      .idbar{ display:flex; align-items:center; justify-content:center; gap:4.03px 4.86px; flex-wrap:wrap; margin-top:16.14px;
        border-top:1px solid var(--line); padding:6.72px 6.48px 1.34px; text-align:center;}

      /* ---------- Hard gate: no user picked ---------- */
      body.gated .tabbar, body.gated .idbar, body.gated #view-schedule, body.gated #view-assign,
      body.gated #view-comp, body.gated #view-race, body.gated #view-tracker, body.gated #view-rooms, body.gated #view-map, body.gated #view-info{ display:none !important;}
      .idbar .who{ font-weight:400; color:var(--muted); font-size:0.6934rem;}
      .idbar .who b{ color:var(--ink-soft); font-weight:400;}
      .idbar .linkbtn, .idbar .pickbtn{ border:0; background:transparent; font:inherit; font-weight:400; font-size:0.6934rem;
        color:var(--accent-strong); cursor:pointer; text-decoration:underline; text-underline-offset:3px; padding:4.03px 3.24px; min-height:29.16px;}

      /* ---------- Name picker — its own in-flow screen ---------- */
      /* Not a modal/overlay: a separate part of the page flow that
         sits BELOW the camp header (title + welcome stay visible at
         all times). In the gated state this screen is the only
         content under the header; picking a name swaps it out for
         the main page (tab bar + views). Being in-flow near the top,
         it naturally sits above the phone keyboard area — no
         viewport tracking needed. Results are capped and scroll
         inside the list if a search returns many names. */
      .picker-screen{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:10.76px 12.96px 12.1px; margin-top:9.41px;}
      .picker-line{ font-size:1.0228rem; font-weight:900; color:var(--ink); margin:0 0 8.07px; line-height:1.35;}
      .picker-screen input[type="search"]{ width:100%; font:inherit; font-size:16px; font-weight:400; padding:7.4px 10.53px; border-radius:9.72px;
        border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); margin-bottom:6.72px;}
      .picker-search-row{ display:flex; gap:5.38px 6.48px; margin-bottom:0;}
      .picker-search-row input[type="search"]{ flex:1 1 auto; width:auto; min-width:0; margin-bottom:0;}
      .picker-search-btn{ flex:none; font:inherit; font-weight:400; font-size:0.78rem; background:var(--accent); color:#FFF7EA;
        border:1px solid transparent; border-radius:9.72px; padding:7.4px 14.58px; cursor:pointer; min-height:37.26px;}
      @media (prefers-color-scheme: dark){ .picker-search-btn{ color:#2A1808;} }
      .name-list{ display:grid; grid-template-columns:1fr 1fr; gap:5.38px 6.48px; overflow:auto; max-height:46vh; align-content:start; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;}
      .name-list:not(:empty){ margin-top:6.72px;}
      .name-list button{ display:block; text-align:left; font:inherit;
        font-weight:400; font-size:0.78rem; background:var(--surface); border:1.5px solid var(--line); border-radius:9.72px; padding:7.4px 10.53px; cursor:pointer; color:var(--ink); min-height:37.26px;}
      .name-list button:hover, .name-list button:active{ border-color:var(--accent); background:var(--accent-soft);}

      /* ---------- Tab bar ---------- */
      .tabbar{ position:sticky; top:8px; z-index:30; display:flex; gap:2.69px 3.24px; margin:5.38px 0 6.72px;
        background:var(--surface); border:1px solid var(--line); border-radius:809.19px; padding:2.02px 4.86px; box-shadow:var(--shadow);}
      .tabbar button{ flex:1; display:inline-flex; align-items:center; justify-content:center; border:0; background:transparent; color:var(--ink-soft); font:inherit; font-weight:400; font-size:0.6934rem;
        border-radius:809.19px; padding:3.36px 1.62px; cursor:pointer; min-height:34.02px; white-space:nowrap;}
      @media (min-width:560px){ .tabbar button{ font-size:0.78rem;} }
      .tabbar button::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--tab-dot, var(--accent)); margin-right:4.86px; flex:none;}
      .tabbar button:nth-child(1){ --tab-dot:var(--accent);}
      .tabbar button:nth-child(2){ --tab-dot:var(--sage);}
      .tabbar button:nth-child(3){ --tab-dot:var(--mustard);}
      .tabbar button:nth-child(4){ --tab-dot:var(--rose);}
      .tabbar button:nth-child(5){ --tab-dot:var(--sage);}
      .tabbar button:nth-child(6){ --tab-dot:var(--accent);}
      .tabbar button:nth-child(7){ --tab-dot:var(--sage);}
      .tabbar button:nth-child(8){ --tab-dot:var(--mustard);}
      /* Map tab: sage / green dot, pinned by id like Race / Tracker
         so its position never recolours the other tabs. */
      #tab-map{ --tab-dot:var(--sage);}
      /* Race tab: warm rose dot, pinned by id so its position
         never recolours the other tabs. */
      #tab-race{ --tab-dot:var(--rose);}
      /* Voting Tracker tab (conditionally present): teal dot,
         pinned by id so inserting it never recolours the others. */
      #tab-tracker{ --tab-dot:var(--teal);}
      /* Competition LIVE (Sat 4:30–5:30 PM): the Competition tab
         flashes gently with stars while the competition runs. */
      .tabbar button.comp-live{ animation:compFlash 1.15s ease-in-out infinite; font-weight:400;}
      /* Amazing Race LIVE (Sat 2:00-4:00 PM): the Race tab flashes
         with stars exactly like the Competition tab does. */
      .tabbar button.race-live{ animation:compFlash 1.15s ease-in-out infinite; font-weight:400;}
      .race-live-line{ background:var(--now-fill); color:#FFF8F0; border-radius:var(--radius); padding:9.41px 12.15px; text-align:center; margin-top:8.07px; box-shadow:var(--shadow-lg); font-size:1.0228rem; font-weight:900;}
      @keyframes compFlash{ 0%,100%{ background:var(--mustard-bg); color:var(--mustard-strong); box-shadow:inset 0 0 0 2px var(--mustard-line);} 50%{ background:var(--accent); color:#FFF7EA; box-shadow:inset 0 0 0 2px var(--accent);} }
      @media (prefers-reduced-motion: reduce){ .tabbar button.comp-live{ animation:none; background:var(--mustard-bg); color:var(--mustard-strong); box-shadow:inset 0 0 0 2px var(--mustard-line);} .tabbar button.race-live{ animation:none; background:var(--mustard-bg); color:var(--mustard-strong); box-shadow:inset 0 0 0 2px var(--mustard-line);} }
      @media (max-width:640px){ .tabbar{ flex-wrap:wrap; border-radius:19.44px;} .tabbar button{ flex:1 1 30%;} }
      .tabbar button[aria-selected="true"]{ background:var(--accent); color:#FFF7EA;}
      .tabbar button[aria-selected="true"]::before{ background:#FFF7EA;}
      @media (prefers-color-scheme: dark){ .tabbar button[aria-selected="true"]{ color:#2A1808;} .tabbar button[aria-selected="true"]::before{ background:#2A1808;} }

      /* ---------- Track toggle ---------- */
      .trackbar{ display:flex; align-items:center; gap:6.72px 8.1px; flex-wrap:wrap; margin:8.07px 0 2.69px;}
      .trackbar .lbl{ font-size:0.7107rem; font-weight:400; letter-spacing:.04em; text-transform:uppercase; color:var(--muted);}
      .seg{ display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:809.19px; padding:2.69px 3.24px; gap:2.69px 3.24px;}
      .seg button{ border:0; background:transparent; font:inherit; font-weight:400; font-size:0.7454rem; color:var(--ink-soft);
        border-radius:809.19px; padding:5.38px 12.96px; cursor:pointer; min-height:34.02px;}
      .seg button[aria-pressed="true"]{ background:var(--surface); color:var(--accent-strong); box-shadow:0 2px 8px rgba(70,64,55,.16);}

      /* ---------- Now view ---------- */
      .clockline{ display:flex; align-items:center; gap:5.38px 6.48px; color:var(--muted); font-weight:400; font-size:0.78rem; margin:6.72px 1.62px 6.72px;}
      .clockline .dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none; animation:pulse 2s infinite;}
      @keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.35 } }
      @media (prefers-reduced-motion: reduce){ .clockline .dot{ animation:none } html{ scroll-behavior:auto } }
      .greet{ font-size:0.9534rem; font-weight:900; margin:5.38px 1.62px 0;}
      .greet-sub{ color:var(--muted); font-weight:400; margin:1.34px 1.62px 0;}

      /* Current: strong filled terracotta card — unmistakable at a glance */
      .now-card{ background:var(--now-fill); color:#FFF8F0; border:0; border-radius:16.2px; padding:9.41px 12.15px; box-shadow:var(--shadow-lg); margin-top:5.38px;}
      .now-card.pre, .now-card.post{ background:var(--surface); color:var(--ink); border:2px solid var(--accent); box-shadow:var(--shadow); text-align:left;}
      .now-card.is-mine{ outline:4px solid var(--gold); outline-offset:2px;}
      .kicker{ display:inline-flex; align-items:center; gap:4.71px 5.67px; font-size:0.676rem; font-weight:400; letter-spacing:.09em; text-transform:uppercase; color:#FFDCC4; margin-bottom:6.05px;}
      .now-card.pre .kicker, .now-card.post .kicker{ color:var(--accent-strong);}
      .kicker .live-dot{ width:8px; height:8px; border-radius:50%; background:#FFD166;}
      .now-title{ font-size:clamp(1.2156rem, 6vw, 1.5929rem); font-weight:900; line-height:1.16; margin:0 0 3.36px; color:#FFFFFF;}
      .now-card.pre .now-title, .now-card.post .now-title{ color:var(--ink);}
      .now-time{ font-size:0.936rem; font-weight:400; color:#FFE8D2; margin:0 0 2.69px;}
      .now-card.pre .now-time, .now-card.post .now-time{ color:var(--ink-soft);}
      .now-note{ color:#FDEADB; font-weight:400; margin:4.71px 0 0; line-height:1.5;}
      .now-card.pre .now-note, .now-card.post .now-note{ color:var(--muted);}
      .now-card .chip{ background:#FFFFFF; border-color:#FFFFFF; color:var(--sage-strong);}
      @media (prefers-color-scheme: dark){ .now-card .chip{ color:#3E5627;} }
      .mine-callout{ display:flex; gap:6.05px 7.29px; align-items:flex-start; background:#FFF6E6; border:0;
        border-radius:11.34px; padding:6.05px 9.72px; margin-top:6.72px; font-weight:400; color:#5B3A10; line-height:1.4; font-size:0.8234rem;}
      .track-split{ display:grid; gap:6.05px 7.29px; margin-top:4.03px;}
      @media (min-width:640px){ .track-split{ grid-template-columns:1fr 1fr;} }
      .track-mini{ background:var(--surface-2); border-radius:12.96px; padding:7.4px 9.72px;}
      .track-mini.is-mine{ outline:2.5px solid var(--mine-line);}
      .track-mini .t{ font-size:0.9707rem; font-weight:400; margin:2.69px 0 1.34px; line-height:1.25;}
      .track-mini .tm{ font-weight:400; color:var(--ink-soft); font-size:0.7974rem;}

      .tag{ display:inline-block; font-size:0.624rem; font-weight:400; letter-spacing:.06em; text-transform:uppercase;
        padding:2.02px 7.29px; border-radius:809.19px; vertical-align:middle;}
      .tag.youth{ background:var(--youth-bg); color:var(--youth);}
      .tag.parents{ background:var(--parents-bg); color:var(--parents);}
      .tag.shared{ background:var(--surface-3); color:var(--ink-soft);}
      .tag.coord{ background:var(--accent-soft); color:var(--accent-strong);}

      .chip{ display:inline-flex; align-items:center; gap:4.03px 4.86px; background:var(--mine-bg); color:var(--mine-ink);
        border:1.5px solid var(--mine-line); border-radius:809.19px; padding:3.36px 9.72px; font-size:0.7107rem; font-weight:400; margin-top:7.4px;}
      .chip svg{ width:13px; height:13px; flex:none;}
      .chip:empty{ display:none;}

      /* Event tag stack: the activity title stands on its own line;
         every personal tag (duty, coordination, assignment)
         sits UNDER it as its own pill, stacked with clear gaps.
         Schedule activities show ONLY the activity itself and these
         bubbles — no food/menu text is rendered on any activity. */
      .ev-tags{ display:flex; flex-direction:column; align-items:flex-start; gap:4.71px 5.67px; margin-top:6.72px;}
      .ev-tags .chip{ margin-top:0;}

      .upnext-h{ font-size:0.8667rem; font-weight:900; margin:8.07px 1.62px 4.03px;}
      .upnext{ display:grid; gap:5.38px 6.48px;}
      @media (min-width:640px){ .upnext{ grid-template-columns:1fr 1fr;} }
      .next-card{ background:var(--surface); border:1px solid var(--line); border-left:5px solid var(--mustard-line); border-radius:12.96px; padding:6.72px 9.72px; text-align:left; width:100%; font:inherit; color:inherit; box-shadow:var(--shadow);}
      .next-card.is-mine{ border:2px solid var(--mine-line); border-left:5px solid var(--sage); background:var(--mine-bg);}
      .next-card .n-time{ display:inline-block; font-weight:400; color:var(--mustard-strong); background:var(--mustard-bg); border-radius:809.19px; padding:1.34px 8.1px; font-size:0.7627rem;}
      .next-card.is-mine .n-time{ color:var(--sage-strong); background:var(--surface);}
      .next-card .n-title{ font-weight:400; font-size:0.9534rem; margin:4.03px 0 0; line-height:1.3; color:var(--ink);}
      .next-card .n-day{ color:var(--muted); font-weight:400; font-size:0.7194rem;}
      .next-card .now-note{ color:var(--muted);}

      .actions{ display:flex; flex-wrap:wrap; gap:5.38px 6.48px; margin-top:9.41px;}
      .btn{ display:inline-flex; align-items:center; justify-content:center; gap:5.38px 6.48px; border-radius:809.19px; font:inherit; font-weight:400; font-size:0.78rem;
        padding:8.07px 17.82px; cursor:pointer; min-height:40.5px; border:1px solid transparent; text-decoration:none;}
      .btn.primary{ background:var(--accent); color:#FFF7EA;}
      @media (prefers-color-scheme: dark){ .btn.primary{ color:#2A1808;} }
      .btn.ghost{ background:var(--surface); color:var(--accent-strong); border-color:var(--line);}
      .btn svg{ width:17px; height:17px;}

      /* ---------- Schedule view — compact single-day list ---------- */
      .daybar{ display:flex; flex-wrap:wrap; gap:4.03px 4.86px; margin:5.38px 0 2.69px;}
      .daybar button{ border:1.5px solid var(--line); background:var(--surface); color:var(--ink-soft); font:inherit; font-weight:400;
        border-radius:809.19px; padding:4.03px 11.34px; cursor:pointer; min-height:29.16px; font-size:0.7627rem;}
      /* Compact overrides scoped to Schedule tab only — Now cards stay roomy */
      #view-schedule .trackbar{ margin:4.03px 0 1.34px; gap:5.38px 6.48px;}
      #view-schedule .seg button{ padding:3.36px 10.53px; min-height:29.16px; font-size:0.7454rem;}
      #view-schedule .day-head{ margin:8.07px 1.62px 4.71px; padding-bottom:3.36px; border-bottom-width:2px;}
      #view-schedule .day-section:first-child .day-head{ margin-top:5.38px;}
      #view-schedule .day-head h2{ font-size:1.0228rem;}
      #view-schedule .day-head .today-flag{ font-size:0.5894rem; padding:2.02px 7.29px;}
      #view-schedule .day-resp, #view-schedule .day-assign{ padding:4.71px 9.72px 2.69px; margin:0 0 5.38px; border-radius:9.72px;}
      #view-schedule .day-resp h3, #view-schedule .day-assign h3{ font-size:0.7974rem; margin:0 0 2.02px;}
      #view-schedule .plain-duty{ padding:3.36px 1.62px; line-height:1.32;}
      #view-schedule .plain-duty .d-what{ font-size:0.7627rem;}
      #view-schedule .plain-duty .d-when{ font-size:0.6587rem; margin-top:0.67px;}
      #view-schedule .plain-duty .d-note{ font-size:0.6934rem; margin-top:1.34px; line-height:1.35;}
      #view-schedule .ev{ padding:4.03px 8.1px; margin:0 0 2.69px; border-radius:8.1px; gap:5.38px 6.48px;}
      #view-schedule .ev.is-now, #view-schedule .ev.is-mine, #view-schedule .ev.is-upnext{ padding:3.36px 7.29px;}
      #view-schedule .ev .ev-time{ width:60px; font-size:0.7974rem; line-height:1.25; padding-top:0.67px;}
      #view-schedule .ev .ev-time .to{ font-size:0.5894rem;}
      #view-schedule .ev .ev-title{ font-size:0.884rem; line-height:1.25;}
      #view-schedule .ev .ev-note{ font-size:0.6934rem; margin-top:0.67px; line-height:1.3;}
      #view-schedule .ev .now-flag, #view-schedule .ev .mine-flag, #view-schedule .ev .upnext-flag{ font-size:0.5374rem; margin-bottom:0.67px;}
      #view-schedule .ev-tags{ gap:2.69px 3.24px; margin-top:2.69px;}
      #view-schedule .ev-tags .chip, #view-schedule .chip{ padding:2.02px 6.48px; font-size:0.6414rem; margin-top:0;}
      .daybar button[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:#FFF7EA;}
      .daybar button[data-day="1"][aria-pressed="true"]{ background:var(--teal); border-color:var(--teal); color:#FFFFFF;}
      .daybar button[data-day="2"][aria-pressed="true"]{ background:var(--gold); border-color:var(--gold); color:var(--gold-ink);}
      @media (prefers-color-scheme: dark){ .daybar button[aria-pressed="true"]{ color:#2A1808;} .daybar button[data-day="1"][aria-pressed="true"]{ color:#122B28;} }
      .day-section{ --day-accent:var(--accent); --day-soft:var(--accent-soft);}
      .day-section.day-0{ --day-accent:var(--accent); --day-soft:var(--accent-soft);}
      .day-section.day-1{ --day-accent:var(--teal); --day-soft:var(--teal-bg);}
      .day-section.day-2{ --day-accent:var(--mustard); --day-soft:var(--mustard-bg);}
      .day-head{ display:flex; align-items:baseline; gap:6.72px 8.1px; margin:12.1px 1.62px 5.38px; padding-bottom:4.03px; border-bottom:3px solid var(--day-accent);}
      .day-section:first-child .day-head{ margin-top:6.72px;}
      .day-head h2{ font-size:1.0228rem; font-weight:900; margin:0;}
      .day-head .today-flag{ font-size:0.5894rem; font-weight:400; letter-spacing:.05em; text-transform:uppercase; color:var(--ink); background:var(--day-soft); padding:2.69px 8.91px; border-radius:809.19px;}
      .day-sub{ color:var(--muted); font-weight:400; font-size:0.78rem; margin:0 1.62px 5.38px;}
      .tracks-2col{ display:grid; gap:8.07px 9.72px;}
      @media (min-width:720px){ .tracks-2col{ grid-template-columns:1fr 1fr; align-items:start;} }
      .track-col-h{ font-size:0.8234rem; font-weight:900; margin:0 1.62px 4.71px; display:flex; align-items:center; gap:5.38px 6.48px;}

      .ev{ display:flex; gap:8.07px 9.72px; width:100%; text-align:left; font:inherit; color:inherit;
        background:var(--surface); border:1px solid var(--line); border-radius:11.34px; padding:7.4px 11.34px; margin:0 0 5.38px;}
      .ev .ev-time{ flex:none; width:76px; font-weight:400; color:var(--accent-strong); font-size:0.7974rem; padding-top:0.67px; line-height:1.35;}
      .day-section.day-1 .ev .ev-time{ color:var(--teal-strong);}
      .day-section.day-2 .ev .ev-time{ color:var(--mustard-strong);}
      .ev .ev-time .to{ display:block; color:var(--muted); font-weight:400; font-size:0.5894rem;}
      .ev .ev-main{ flex:1; min-width:0;}
      .ev .ev-title{ font-weight:400; font-size:0.884rem; line-height:1.32; color:var(--ink);}
      .ev .ev-note{ color:var(--muted); font-weight:400; font-size:0.6934rem; margin-top:1.34px; line-height:1.4;}
      .ev.is-now{ border:2px solid var(--day-accent, var(--now-ring)); padding:6.72px 10.53px;}
      /* Up next: the day's first event before it starts — mustard
         emphasis, deliberately NOT the filled terracotta Current. */
      .ev.is-upnext{ border:2px solid var(--mustard-line); background:var(--mustard-bg); padding:6.72px 10.53px;}
      .ev .upnext-flag{ font-size:0.6414rem; font-weight:400; letter-spacing:.03em; color:var(--mustard-strong); display:block; margin-bottom:1.34px;}
      .camp-over-card{ background:var(--sage-bg); border:2px solid var(--sage-line); border-radius:var(--radius); padding:10.76px 11.34px; text-align:center; font-size:0.9967rem; font-weight:400; color:var(--sage-strong); margin:0 0 6.72px; line-height:1.35;}
      .ev.is-mine{ border:2px solid var(--mine-line); background:var(--mine-bg); padding:6.72px 10.53px;}
      .ev.is-selected{ outline:3px solid var(--amber); outline-offset:1px;}
      .ev .now-flag{ font-size:0.6067rem; font-weight:400; letter-spacing:.07em; text-transform:uppercase; color:var(--accent-strong); display:block; margin-bottom:1.34px;}
      .ev .mine-flag{ font-size:0.6067rem; font-weight:400; letter-spacing:.07em; text-transform:uppercase; color:var(--mine-ink); display:block; margin-bottom:1.34px;}
      /* ---------- Meal responsibility panels (Schedule) ----------
         Only rendered for the meal-expander viewers — the six
         coordinators plus Kerry and Winly: meal-duty events on
         the Schedule become tappable and expand a panel underneath
         naming who prepares and who cleans up for that meal. (The
         Assignments "All meal duties" section stays coordinators
         only; Kerry and Winly do not get it.) */
      .ev.is-tappable{ cursor:pointer;}
      /* The expander is a bare chevron at the RIGHT edge of the
         bubble — no text label (Anthony, 2026-11-26 eve). It
         flips to point up while the panel is open. */
      .meal-chev{ flex:none; align-self:center; display:inline-flex; align-items:center; justify-content:center; color:var(--accent-strong);}
      .meal-chev svg{ width:16px; height:16px; flex:none; transition:transform .18s ease;}
      .ev.is-open .meal-chev svg{ transform:rotate(180deg);}
      @media (prefers-reduced-motion: reduce){ .meal-chev svg{ transition:none;} }
      .meal-panel{ background:var(--surface-2); border:1px solid var(--line); border-radius:11.34px; padding:7.4px 11.34px; margin:0 0 5.38px;}
      .meal-panel[hidden]{ display:none;}
      #view-schedule .meal-panel{ padding:6.05px 9.72px; margin:0 0 2.69px;}
      .meal-duty + .meal-duty{ margin-top:6.72px; padding-top:6.72px; border-top:1px dashed var(--line);}
      .meal-duty-head{ margin:0; font-size:0.8234rem; line-height:1.4; color:var(--ink);}
      .meal-duty-label{ font-weight:900; color:var(--accent-strong);}
      .meal-duty-groups{ font-weight:900;}
      .meal-people{ margin:1.34px 0 0; font-size:0.7974rem; font-weight:400; color:var(--ink-soft); line-height:1.5;}
      /* Schedule expander only: responsible members one per line,
         in a smaller font than the bubble text around them. */
      .meal-people-rows{ list-style:none; margin:2.02px 0 0; padding:0; font-size:0.7276rem; font-weight:400; color:var(--ink-soft); line-height:1.5;}
      .meal-people-rows li{ margin:0; padding:0;}
      /* Per-group cards inside a duty section (Anthony, 2026-11-26
         late): one card per contributing group/party, header =
         the group name, body = that group's members one per line.
         Shown even when only one group does the duty, so it is
         always obvious who belongs to which group. Two parties
         sit side by side when there is room, stacked otherwise. */
      .meal-group-cards{ display:grid; grid-template-columns:repeat(auto-fit, minmax(128px, 1fr)); gap:5.38px; margin-top:4.03px;}
      .meal-group-card{ background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:5.38px 8.07px 6.05px; min-width:0;}
      .meal-group-head{ margin:0; font-size:0.7799rem; font-weight:900; line-height:1.35; color:var(--ink);}
      /* Assignments "All meal duties" cards (coordinators only) */
      .meal-duty-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:8.07px 11.34px; margin-top:6.72px;}
      .meal-duty-card h3{ font-size:0.9534rem; font-weight:900; margin:0;}
      .meal-duty-card .meal-when{ color:var(--muted); font-weight:400; font-size:0.7627rem; margin:1.34px 0 6.05px;}
      .meal-status{ display:inline-block; font-size:0.624rem; font-weight:400; letter-spacing:.06em; text-transform:uppercase; padding:2.02px 7.29px; border-radius:809.19px; vertical-align:2px; margin-left:6.48px;}
      .meal-status.is-now{ background:var(--now-fill); color:#FFF8F0;}
      .meal-status.is-next{ background:var(--mustard-bg); color:var(--mustard-strong); border:1px solid var(--mustard-line);}
      /* ---------- Meal location tags ----------
         Shown on meal events (Schedule), on meal-duty entries
         (Assignments) and on the per-group party cards of the
         coordinators' All meal duties cards. The text is ALWAYS
         a room number ("Room P273"), "room number tba" when a
         unit is assigned but has no room number yet, or "no unit"
         when no unit is assigned — a unit number is never
         displayed (see mealLocations). */
      .loc-tag{ display:inline-flex; align-items:center; gap:4.03px 4.86px; background:var(--teal-bg); color:var(--teal-strong);
        border:1px solid var(--teal-line); border-radius:809.19px; padding:2.02px 8.1px; font-size:0.6934rem; font-weight:400; line-height:1.35; white-space:nowrap;}
      .loc-tag::before{ content:""; width:6px; height:6px; border-radius:50%; background:var(--teal); flex:none;}
      #view-schedule .loc-tag{ padding:1.34px 6.48px; font-size:0.6414rem;}
      .ev.is-current-filled .loc-tag{ background:#FFFFFF; border-color:#FFFFFF; color:var(--teal-strong);}
      .ev.is-current-filled .loc-tag::before{ background:var(--teal);}
      .plain-duty .d-loc{ display:block; margin-top:2.69px;}
      .meal-group-loc{ margin-top:4.03px;}
      .comp-loc{ margin-top:4.03px;}
      .ev-list{ display:block;}
      .flash{ animation:flash 1.6s ease;}
      @keyframes flash{ 0%,60%{ background:var(--accent-soft) } 100%{ background:var(--surface) } }
      @media (prefers-reduced-motion: reduce){ .flash{ animation:none } }

      /* ---------- Responsibilities / generic cards ---------- */
      .resp-intro{ color:var(--ink-soft); font-weight:400; line-height:1.5; margin:5.38px 1.62px 2.02px; max-width:62ch;}
      .resp-sec{ margin-top:12.1px;}
      .resp-sec > h2{ font-size:1.0228rem; font-weight:900; margin:0 1.62px 2.02px;}
      .resp-sec > p{ color:var(--muted); font-weight:400; margin:0 1.62px 5.38px; line-height:1.45;}
      .resp-sec.upcoming-sec > h2{ font-size:1.0228rem; color:var(--sage-strong);}
      .resp-sec.past-sec{ opacity:.68;}
      .resp-sec.past-sec .cat-card{ background:var(--surface-2); border-color:var(--line);}
      #view-assign .cat-card{ background:var(--mustard-bg); border-color:var(--mustard-line);}
      #view-assign .plain-duty{ border-top-color:var(--mustard-line);}
      #view-assign .resp-sec.upcoming-sec > h2{ color:var(--mustard-strong);}
      .duty{ display:block; width:100%; text-align:left; font:inherit; color:inherit; background:transparent; border:0; border-top:1px dashed var(--sage-line);
        padding:4.71px 1.62px; cursor:pointer; line-height:1.4;}
      .duty:first-of-type{ border-top:0;}
      .duty .d-cat{ display:inline-block; font-size:0.6067rem; font-weight:400; letter-spacing:.05em; text-transform:uppercase; color:var(--chip-ink);
        background:var(--surface); border:1px solid var(--chip-line); border-radius:809.19px; padding:2.02px 7.29px; margin-right:6.48px; vertical-align:1px;}
      .duty .d-what{ font-weight:400; font-size:0.8667rem;}
      .duty .d-when{ display:block; color:var(--muted); font-weight:400; font-size:0.7974rem; margin-top:1.34px;}
      button.duty:hover .d-what{ color:var(--accent-strong); text-decoration:underline;}
      .plain-duty{ padding:4.71px 1.62px; border-top:1px dashed var(--sage-line); line-height:1.4;}
      .now-resp-card .plain-duty, .day-resp .plain-duty{ border-top-color:var(--sage-line);}
      .cat-card .plain-duty{ border-top-color:var(--sage-line);}
      .plain-duty:first-of-type{ border-top:0;}
      .plain-duty .d-cat{ display:inline-block; font-size:0.6067rem; font-weight:400; letter-spacing:.05em; text-transform:uppercase; color:var(--chip-ink);
        background:var(--surface); border:1px solid var(--chip-line); border-radius:809.19px; padding:2.02px 7.29px; margin-right:6.48px; vertical-align:1px;}
      #view-schedule .plain-duty .d-cat, .now-resp-card .plain-duty .d-cat{ background:#FFFFFF;}
      @media (prefers-color-scheme: dark){ #view-schedule .plain-duty .d-cat, .now-resp-card .plain-duty .d-cat{ background:var(--surface);} }
      .plain-duty .d-what{ font-weight:400; font-size:0.8667rem;}
      .plain-duty .d-when{ display:block; color:var(--muted); font-weight:400; font-size:0.7974rem; margin-top:1.34px;}
      .plain-duty .d-note{ display:block; color:var(--ink-soft); font-weight:400; font-size:0.7974rem; margin-top:2.02px; line-height:1.45;}
      .cat-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:4.03px 11.34px 5.38px; margin-bottom:6.72px;}
      .cat-card h3{ font-size:0.884rem; font-weight:900; margin:6.05px 0 0.67px;}
      .note-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:7.4px 11.34px; line-height:1.5; font-weight:400; color:var(--ink-soft);}
      .note-card strong{ color:var(--ink);}
      .prompt-card{ background:var(--surface); border:2px dashed var(--teal-line); border-radius:var(--radius); padding:12.1px 12.96px; text-align:center; margin-top:9.41px;}
      .prompt-card h2{ font-size:1.0228rem; font-weight:900; margin:0 0 3.36px;}
      .prompt-card p{ color:var(--muted); font-weight:400; line-height:1.5; margin:0 auto 8.07px; max-width:44ch;}
      .me-card{ background:var(--sage-bg); border:2px solid var(--sage-line); border-radius:var(--radius); padding:8.07px 11.34px; margin-top:8.07px;}
      .me-card h2{ font-size:1.0228rem; font-weight:900; margin:0 0 2.69px;}
      .me-card p{ margin:1.34px 0; font-weight:400; color:var(--ink-soft); line-height:1.45;}
      .me-card p b{ color:var(--ink);}

      /* ---------- Rooms ---------- */
      .findbar{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:8.07px 11.34px; margin-top:9.41px;}
      .findbar label{ display:block; font-weight:400; font-size:0.7452rem; margin-bottom:4.03px;}
      .findrow{ display:flex; gap:5.38px 6.48px; flex-wrap:nowrap;}
      .findrow input{ flex:1 1 auto; width:auto; min-width:0; font:inherit; font-size:0.8rem; font-weight:400; line-height:1.2; padding:3.32px 8px; height:30px; border-radius:8px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); min-height:30px;}
      .findrow input::placeholder{ font-size:0.8rem;}
      .findrow .btn{ flex:none; font-size:0.8rem; line-height:1.2; padding:3.32px 12px; height:30px; min-height:30px; border-radius:8px;}
      .find-msg{ color:var(--muted); font-weight:400; font-size:0.8667rem; margin:4.71px 0 0; line-height:1.4;}
      /* Find results: tappable name options reuse the gate's
         .name-list look; the picked person's room card renders
         in .find-result BELOW the findbar, never replacing the
         top of the Rooms tab. */
      .find-list{ max-height:38vh;}
      .find-result{ margin-top:6.72px;}
      .find-result:empty{ display:none;}
      .find-result-h{ font-size:0.884rem; font-weight:900; margin:0 1.62px 4.71px; color:var(--ink); line-height:1.3;}
      .room-grid{ display:grid; gap:6.72px 8.1px; margin-top:6.72px;}
      @media (min-width:640px){ .room-grid{ grid-template-columns:1fr 1fr;} }
      .room-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:8.07px 11.34px;}
      .room-card.big{ border:2px solid var(--accent); background:var(--accent-soft); padding:9.41px 12.15px;}
      .room-card.is-mine{ border:2px solid var(--mine-line); background:var(--mine-bg);}
      .room-card .r-top{ display:flex; align-items:baseline; gap:6.05px 7.29px; flex-wrap:wrap;}
      .room-card h3{ font-size:0.884rem; font-weight:900; margin:0;}
      .room-card.big h3{ font-size:1.0228rem;}
      .room-num{ font-weight:400; color:var(--accent-strong); font-size:0.8667rem;}
      .room-meta{ color:var(--muted); font-weight:400; font-size:0.8667rem; margin:2.02px 0 0; line-height:1.4;}
      .room-meta b{ color:var(--ink-soft);}
      .occ-list{ list-style:none; margin:5.38px 0 0; padding:0; display:grid; gap:2.69px 3.24px;}
      .occ-list li{ font-weight:400; color:var(--ink-soft); display:flex; align-items:center; gap:5.38px 6.48px; flex-wrap:wrap; line-height:1.35;}
      .occ-list li.leader{ font-weight:400; color:var(--ink);}
      .occ-list li.leader strong{ font-weight:400;}
      .res-line{ color:var(--muted); font-weight:400; font-size:0.7974rem; margin:5.38px 0 0;}
      .star-note{ font-weight:400; color:var(--ink-soft); font-size:0.8667rem; margin:1.34px 1.62px 0; line-height:1.4;}

      /* ---------- Competition phases ---------- */
      .coord-line-card{ background:var(--sage-bg); border:2px solid var(--sage-line); border-radius:var(--radius); padding:10.76px 11.34px; text-align:center; font-size:0.8667rem; font-weight:400; color:var(--sage-strong); margin-top:4.71px; line-height:1.35;}
      .comp-timer-card{ background:var(--now-fill); color:#FFF8F0; border-radius:var(--radius); padding:9.41px 12.15px; text-align:center; margin-top:8.07px; box-shadow:var(--shadow-lg);}
      .comp-timer-card .comp-timer-label{ font-size:0.6934rem; font-weight:400; letter-spacing:.08em; text-transform:uppercase; color:#FFDCC4; margin:0;}
      .comp-timer-card .comp-timer-value{ font-size:1.0228rem; font-weight:400; line-height:1.2; margin:2.69px 0 0; font-variant-numeric:tabular-nums;}
      .comp-timer-card .comp-timer-sub{ font-weight:400; color:#FDEADB; margin:1.34px 0 0; font-size:0.8667rem;}
      .comp-done-card{ background:var(--sage-bg); border:2px solid var(--sage-line); border-radius:var(--radius); padding:13.45px 11.34px; text-align:center; font-size:0.8667rem; font-weight:400; color:var(--sage-strong); margin-top:9.41px; line-height:1.35;}
      .score-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:4.03px 11.34px 6.72px; margin-top:4.71px;}
      .score-row{ display:flex; align-items:center; justify-content:space-between; gap:8.07px 9.72px; padding:6.05px 0; border-top:1px dashed var(--line);}
      .score-row:first-of-type{ border-top:0;}
      .score-row label{ font-weight:400; font-size:0.8667rem; line-height:1.3; flex:1 1 auto; min-width:0;}
      .score-row input[type="number"]{ flex:none; width:84px; font:inherit; font-weight:400; font-size:0.78rem; text-align:center; padding:6.05px 6.48px; border-radius:9.72px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); min-height:37.26px;}
      .rank-list{ list-style:none; margin:4.03px 0 0; padding:0; display:grid; gap:4.03px 4.86px;}
      .rank-list li{ display:flex; align-items:baseline; justify-content:space-between; gap:8.07px 9.72px; background:var(--mustard-bg); border:1px solid var(--mustard-line); border-radius:9.72px; padding:5.38px 9.72px; font-weight:400; line-height:1.35;}
      .rank-list li .rank-score{ font-weight:400; color:var(--mustard-strong); flex:none;}
      .rank-empty{ font-weight:400; color:var(--muted); margin:2.69px 0 0; line-height:1.45;}

      /* ---------- Competition rules, criteria, voting, scoreboard ---------- */
      .rules-list{ margin:0; padding-left:17.82px; display:grid; gap:4.71px 5.67px;}
      .rules-list li{ line-height:1.45;}
      .criteria-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:9.41px 11.34px; padding:5.38px 0; border-top:1px dashed var(--line);}
      .criteria-row:first-of-type{ border-top:0;}
      .criteria-main{ flex:1 1 auto; min-width:0;}
      .criteria-name{ font-weight:400; display:block; line-height:1.3;}
      .criteria-consider{ display:block; color:var(--muted); font-weight:400; font-size:0.8667rem; line-height:1.4; margin-top:0.67px;}
      .criteria-points{ font-weight:400; font-size:0.78rem; color:var(--accent-strong); flex:none;}
      .criteria-total .criteria-points{ color:var(--ink);}
      .award-line{ margin:0; line-height:1.5;}
      .award-line + .award-line{ margin-top:2.69px;}
      .crit-max{ color:var(--muted); font-weight:400; font-size:0.7974rem;}
      .dish-vote{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:6.72px 11.34px 8.07px; margin-top:6.72px;}
      .dish-vote-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8.07px 9.72px; margin-bottom:1.34px;}
      .dish-vote-name{ font-weight:900; font-size:0.884rem; line-height:1.3;}
      .dish-vote-total{ font-weight:400; color:var(--mustard-strong); flex:none; font-size:0.78rem; white-space:nowrap;}
      .crit-row{ display:flex; align-items:center; justify-content:space-between; gap:8.07px 9.72px; padding:4.03px 0; border-top:1px dashed var(--line);}
      .crit-row label{ font-weight:400; font-size:0.8667rem; line-height:1.3; flex:1 1 auto; min-width:0;}
      .crit-row input[type="number"]{ flex:none; width:76px; font:inherit; font-weight:400; font-size:0.78rem; text-align:center; padding:5.38px 4.86px; border-radius:9.72px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); min-height:35.64px;}
      .sb-row{ padding:6.05px 0; border-top:1px dashed var(--line);}
      .sb-row:first-of-type{ border-top:0;}
      .sb-dish{ font-weight:900; font-size:0.884rem; line-height:1.35;}
      .sb-nums{ display:flex; flex-wrap:wrap; gap:2.69px 14.58px; margin-top:2.02px; font-weight:400; color:var(--ink-soft); font-size:0.8667rem; line-height:1.45;}
      .sb-kind{ font-weight:400; color:var(--muted);}
      .award-badge{ display:inline-block; background:var(--mustard-bg); border:1.5px solid var(--mustard-line); color:var(--mustard-strong); border-radius:809.19px; padding:1.34px 8.1px; font-size:0.676rem; font-weight:400; vertical-align:2px; margin-left:4.86px; white-space:nowrap;}

      /* ---------- Final results: award tabs, category tabs, present cards, standings ---------- */
      .final-cat-tabs{ display:flex; gap:4.03px 4.86px; background:var(--surface); border:1px solid var(--line); border-radius:809.19px; padding:3.36px 4.05px; margin-top:6.72px; box-shadow:var(--shadow);}
      .final-cat-tabs button{ flex:1; font:inherit; font-weight:400; font-size:0.78rem; border:0; background:transparent; color:var(--ink-soft); border-radius:809.19px; padding:6.72px 9.72px; cursor:pointer; min-height:37.26px;}
      .final-cat-tabs button[aria-selected="true"]{ background:var(--accent); color:#FFF7EA;}
      @media (prefers-color-scheme: dark){ .final-cat-tabs button[aria-selected="true"]{ color:#2A1808;} }
      .award-card{ margin-top:8.07px;}
      /* Wrapped present (closed award): CSS gift box — lid, gold
         ribbon and bow, no images or emojis. The winner is never
         in this markup; cracks grow with tap progress
         (data-crack light, then heavy) until the card's own
         random tap threshold bursts it open into the reveal. */
      .present-card{ position:relative; display:block; width:100%; padding:0; overflow:hidden; isolation:isolate; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
        border:2px solid rgba(0,0,0,.18); border-radius:var(--radius); box-shadow:var(--shadow);
        font:inherit; text-align:center; cursor:pointer; color:#FFF7EA;}
      .present-judges{ background:linear-gradient(165deg, #C06A44, var(--accent) 55%, var(--accent-strong));}
      .present-peoples{ background:linear-gradient(165deg, #4E8A83, var(--teal) 55%, var(--teal-strong));}
      @media (prefers-color-scheme: dark){
        .present-judges{ background:linear-gradient(165deg, #8A4326, #74381F);}
        .present-peoples{ background:linear-gradient(165deg, #2C5A55, #224743);}
      }
      .present-card::before{ content:""; position:absolute; top:0; bottom:0; left:50%; width:34px; margin-left:-13.77px; background:var(--gold); opacity:.5; z-index:0;}
      .present-lid{ position:relative; z-index:1; display:block; height:54px; background:rgba(0,0,0,.16); border-bottom:3px solid rgba(0,0,0,.20);}
      .present-bow{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:70px; height:30px; display:block;}
      .present-bow i{ position:absolute; top:2px; width:32px; height:24px; border:6px solid var(--gold); border-radius:50%; display:block;}
      .present-bow .bow-l{ left:0; transform:rotate(-22deg);}
      .present-bow .bow-r{ right:0; transform:rotate(22deg);}
      .present-bow .bow-knot{ left:50%; top:9px; width:14px; height:14px; margin-left:-5.67px; border:0; border-radius:50%; background:var(--gold);}
      .present-body{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:7.4px 8.91px; padding:12.1px 11.34px 13.45px;}
      .present-tag{ display:inline-block; background:var(--surface); color:var(--ink); border-radius:9.72px; padding:6.05px 12.96px 4.71px; box-shadow:0 3px 10px rgba(0,0,0,.22); transform:rotate(-1.5deg);}
      .present-award-name{ display:block; font-size:1.0228rem; font-weight:900; line-height:1.2; color:var(--ink);}
      .present-cat{ display:block; font-size:0.676rem; font-weight:400; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-top:0.67px;}
      .present-prompt{ display:inline-block; font-weight:400; font-size:0.78rem; background:rgba(0,0,0,.28); color:#FFF7EA; border-radius:809.19px; padding:4.03px 11.34px;}
      .present-cracks{ position:absolute; inset:0; z-index:2; pointer-events:none;}
      .present-cracks i{ position:absolute; display:block; width:3px; border-radius:1.62px; background:rgba(30,20,12,.68); opacity:0; transition:opacity .2s ease;}
      .present-cracks .c1{ left:22%; top:64px; height:52px; transform:rotate(14deg);}
      .present-cracks .c2{ left:70%; top:70px; height:64px; transform:rotate(-18deg);}
      .present-cracks .c3{ left:44%; top:122px; height:58px; transform:rotate(24deg);}
      .present-cracks .c4{ left:82%; top:132px; height:44px; transform:rotate(10deg);}
      .present-card[data-crack="light"] .present-cracks .c1, .present-card[data-crack="light"] .present-cracks .c2{ opacity:.75;}
      .present-card[data-crack="heavy"] .present-cracks i{ opacity:.9;}
      .present-card[data-crack="heavy"] .present-lid{ transform:rotate(-1.8deg); transform-origin:12% 100%;}
      .present-card.shake{ animation:presentShake .45s ease;}
      @keyframes presentShake{ 0%,100%{ transform:translateX(0) rotate(0);} 18%{ transform:translateX(-8px) rotate(-1.4deg);} 38%{ transform:translateX(7px) rotate(1.3deg);} 58%{ transform:translateX(-5px) rotate(-.8deg);} 78%{ transform:translateX(3px) rotate(.5deg);} }
      /* Revealed award */
      .award-revealed{ position:relative; overflow:hidden; background:var(--surface); border:2px solid var(--gold); border-radius:var(--radius); padding:10.76px 11.34px 8.07px; text-align:center; box-shadow:var(--shadow);}
      .award-revealed.is-mine-won{ background:var(--mustard-bg); border-color:var(--gold); box-shadow:var(--shadow-lg); animation:wonGlow 2.6s ease-in-out infinite;}
      .award-revealed.is-mine-won.pop{ animation:awardPop .55s ease, wonGlow 2.6s ease-in-out .55s infinite;}
      @keyframes wonGlow{ 0%,100%{ box-shadow:0 0 0 0 rgba(223,169,46,0), var(--shadow-lg);} 50%{ box-shadow:0 0 26px 5px rgba(223,169,46,.5), var(--shadow-lg);} }
      /* Shimmering shine sweep across a "You won!" card */
      .award-revealed.is-mine-won::before{ content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
        background:linear-gradient(115deg, transparent 32%, rgba(223,169,46,.22) 47%, rgba(255,246,205,.5) 52%, transparent 68%);
        transform:translateX(-130%); animation:wonShine 3.4s ease-in-out infinite;}
      @keyframes wonShine{ 0%{ transform:translateX(-130%);} 45%,100%{ transform:translateX(130%);} }
      .award-revealed.is-mine-won > *{ position:relative; z-index:1;}
      /* Twinkling gold sparkles around a "You won!" card */
      .award-revealed > .sparkles{ position:absolute; inset:0; z-index:2; pointer-events:none;}
      .sparkle{ position:absolute; display:block; width:13px; height:13px; background:var(--gold);
        clip-path:polygon(50% 0, 63% 37%, 100% 50%, 63% 63%, 50% 100%, 37% 63%, 0 50%, 37% 37%);
        opacity:0; animation:sparkleTwinkle 1.9s ease-in-out infinite;}
      .sparkle.s1{ top:12px; left:6%; animation-delay:0s;}
      .sparkle.s2{ top:10px; right:7%; width:9px; height:9px; animation-delay:.45s;}
      .sparkle.s3{ top:44%; left:3.5%; width:9px; height:9px; animation-delay:.9s;}
      .sparkle.s4{ top:40%; right:4%; animation-delay:1.25s;}
      .sparkle.s5{ bottom:14px; left:11%; width:10px; height:10px; animation-delay:.65s;}
      .sparkle.s6{ bottom:12px; right:10%; animation-delay:1.55s;}
      .sparkle.s7{ top:6px; left:47%; width:8px; height:8px; animation-delay:1.05s;}
      @keyframes sparkleTwinkle{ 0%,100%{ opacity:0; transform:scale(.35) rotate(0deg);} 50%{ opacity:1; transform:scale(1) rotate(40deg);} }
      .is-mine-won .you-won-banner{ animation:wonBannerPulse 1.7s ease-in-out infinite;}
      @keyframes wonBannerPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.05);} }
      .award-revealed.pop{ animation:awardPop .55s ease;}
      @keyframes awardPop{ 0%{ transform:scale(.9); opacity:.3;} 55%{ transform:scale(1.035); opacity:1;} 100%{ transform:scale(1); opacity:1;} }
      @media (prefers-reduced-motion: reduce){ .present-card.shake, .award-revealed.pop, .award-revealed.is-mine-won, .award-revealed.is-mine-won.pop, .award-revealed.is-mine-won::before, .is-mine-won .you-won-banner{ animation:none;} .sparkle{ animation:none; opacity:.55;} }
      .award-kicker{ font-size:0.676rem; font-weight:400; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);}
      /* Revealed award title: a real headline — bright, and one
         step under the dish name (1.45rem). The dish and award
         title are the celebration moment, so they sit a tasteful
         step above the Schedule scale; everything else on the
         card matches Schedule sizes. Judges' uses the warm
         accent, People's uses teal, matching the present colours. */
      .award-title{ display:block; font-size:1.0899rem; font-weight:900; line-height:1.2; color:var(--accent-strong);}
      .award-title-peoples{ color:var(--teal-strong);}
      .award-cat-line{ display:block; font-size:0.6934rem; font-weight:400; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-top:2.02px;}
      .you-won-banner{ display:block; margin:6.72px auto 1.34px; background:var(--gold); color:var(--gold-ink); font-size:1.0228rem; font-weight:900; border-radius:809.19px; padding:6.05px 14.58px;}
      .tie-line{ font-weight:400; color:var(--mustard-strong); margin:5.38px 0 0; line-height:1.4;}
      .winner-block{ padding:6.72px 0 2.69px;}
      /* Joint winners (a tie): each tied dish's block is set
         apart from the next by a strong full gold rule and
         generous space, so two winners' scores and member
         lists never blur into one. Single-winner cards have
         only one block, so this never shows there. */
      .winner-block + .winner-block{ border-top:3px solid var(--gold); margin-top:12.1px; padding-top:12.1px;}
      .winner-dish{ font-size:1.2156rem; font-weight:900; line-height:1.2;}
      .winner-score{ font-weight:400; color:var(--accent-strong); font-size:0.884rem; margin-top:2.02px;}
      .winner-score-label{ font-weight:400; color:var(--muted); font-size:0.7974rem;}
      .winner-members{ max-width:340px; margin:2.69px auto 1.34px; text-align:left;}
      /* "Members" caption: on a block the viewer did NOT win,
         the names list is introduced by this small muted
         caption on the plain card background — no band, no
         divider line. On the viewer's OWN winning block the
         members list is not rendered at all. */
      .winner-members-h{ font-size:0.676rem; font-weight:400; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); text-align:center; margin:9.41px 0 0;}
      .winner-none{ font-weight:400; color:var(--muted); margin:6.72px 0 2.69px; line-height:1.45;}
      .winner-crit{ font-weight:400; color:var(--muted); font-size:0.7974rem; line-height:1.5; margin:5.38px auto 1.34px; max-width:520px;}
      .crit-avg-line{ font-weight:400; color:var(--ink-soft); font-size:0.8667rem; line-height:1.55; margin-top:4.03px;}
      /* Per-criteria averages: one criterion per line, label left,
         score right — used on the Judges' Award card and in the
         expanded standings detail. */
      .crit-list{ max-width:520px; margin:6.72px auto 2.69px; text-align:left;}
      .crit-list-h{ font-size:0.676rem; font-weight:400; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); text-align:center; margin-bottom:1.34px;}
      .crit-line{ display:flex; align-items:baseline; justify-content:space-between; gap:10.76px 12.96px; padding:4.03px 1.62px; border-top:1px dashed var(--line); font-size:0.8667rem; line-height:1.4;}
      .crit-line .crit-label{ font-weight:400; color:var(--ink-soft);}
      .crit-line .crit-val{ font-weight:400; color:var(--ink); white-space:nowrap; font-variant-numeric:tabular-nums;}
      .stand-detail .crit-list{ max-width:none; margin:5.38px 0 0;}
      .stand-detail .crit-list-h{ text-align:left;}
      /* Expanded standings: members last, same treatment as the
         award cards — small muted "Members" caption above plain
         names (no leader star) on the plain background — but
         left-aligned to match the standings detail layout. */
      .stand-detail .winner-members-h{ text-align:left;}
      .stand-detail .winner-members{ max-width:none; margin:2.69px 0 1.34px;}
      .standings-locked{ background:var(--surface); border:1.5px dashed var(--line); border-radius:var(--radius); padding:10.76px 11.34px; text-align:center; font-weight:400; color:var(--muted); margin-top:8.07px; line-height:1.4;}
      /* Locked winner present: a Judges' winner card while the
         Judges' Reward above it is still sealed — dimmed, and
         its taps do nothing (it renders without a tap binding). */
      .present-locked{ opacity:.52; cursor:default; filter:saturate(.6);}
      /* Judges' Reward: intro line above the reward present,
         and the revealed voucher picture + caption. The opened
         reward card itself reuses .award-revealed.is-mine-won,
         so it gets the same gold sparkles, pulsing glow and
         shine sweep as a "You won!" card. */
      .reward-lead{ font-weight:400; color:var(--ink-soft); line-height:1.5; margin:9.41px 1.62px 0;}
      .reward-img-btn{ display:block; width:100%; margin-top:8.07px; padding:0; border:0; background:none; cursor:zoom-in; -webkit-tap-highlight-color:transparent;}
      .reward-img{ display:block; width:100%; height:auto; border-radius:9.72px; box-shadow:0 4px 14px rgba(0,0,0,.18);}
      .reward-caption{ font-weight:400; color:var(--muted); font-size:0.7974rem; line-height:1.4; margin:5.38px 0 2.69px;}
      /* Full-screen picture lightbox (the reward voucher):
         dark warm backdrop, picture as large as fits, ✕ to
         close; tapping the backdrop closes it too. */
      .lightbox{ position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center; padding:14.94px 18px; background:rgba(28,17,8,.94); cursor:zoom-out;}
      .lightbox.open{ display:flex;}
      .lightbox img{ max-width:100%; max-height:100%; object-fit:contain; border-radius:8.1px; box-shadow:0 10px 40px rgba(0,0,0,.5);}
      .lightbox-close{ position:absolute; top:calc(12px + env(safe-area-inset-top, 0px)); right:14px; width:42px; height:42px; border-radius:50%; border:1.5px solid rgba(255,247,234,.55); background:rgba(0,0,0,.45); color:#FFF7EA; font:inherit; font-size:1.2937rem; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0 0 1.66px;}
      .stand-card{ background:var(--surface); border:1px solid var(--line); border-radius:12.96px; margin-top:5.38px; overflow:hidden;}
      .stand-head{ display:flex; align-items:flex-start; gap:8.07px 9.72px; width:100%; text-align:left; font:inherit; color:inherit; background:transparent; border:0; padding:8.07px 11.34px; cursor:pointer;}
      .stand-rank{ flex:none; width:24.3px; height:24.3px; margin-top:1.34px; border-radius:50%; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-soft); font-weight:900; font-size:0.7974rem; display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums;}
      .stand-main{ flex:1 1 auto; min-width:0; display:block;}
      .stand-dish{ font-weight:900; font-size:0.884rem; line-height:1.25; color:var(--ink); display:block;}
      .stand-nums{ display:flex; flex-wrap:wrap; gap:2.69px 14.58px; margin-top:2.69px; font-weight:400; color:var(--ink-soft); font-size:0.8667rem; line-height:1.45;}
      .stand-toggle-hint{ font-weight:400; color:var(--accent-strong); font-size:0.7974rem; margin-top:2.69px; display:block;}
      .stand-detail{ padding:0 11.34px 8.07px; border-top:1px dashed var(--line);}
      .stand-counts{ font-weight:400; color:var(--ink-soft); font-size:0.8667rem; line-height:1.5; margin-top:5.38px;}
      /* Amazing Race final results: the standings card above with
         a gold Winner treatment on 1st place, the is-mine
         highlight on the viewer's own group, and the score set
         large at the head's right edge. */
      .stand-card.is-winner{ border:2px solid var(--gold);}
      .stand-card.is-mine{ border:2px solid var(--mine-line); background:var(--mine-bg);}
      .stand-card.is-winner.is-mine{ border-color:var(--gold);}
      .stand-rank.is-first{ background:var(--gold); border-color:var(--gold); color:var(--gold-ink);}
      .stand-dish .tag{ margin-left:4.86px;}
      .tag.mine{ background:var(--surface); color:var(--mine-ink); border:1.5px solid var(--mine-line);}
      .race-score{ flex:none; font-weight:900; font-size:1.0228rem; line-height:1.1; color:var(--accent-strong); font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right; margin-top:1.34px;}
      .race-score small{ display:block; font-size:0.624rem; font-weight:400; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}
      /* Segmented digital countdown (Avengers: Doomsday clock
         style): a row of neat blocks on the warm timer card, each
         a big bold number over a tiny unit label. Used by the
         race countdown-to-start and the during-race time
         remaining; the 1-second clock updates each block's
         number in place. */
      .cd-segs{ display:flex; justify-content:center; gap:5.38px 6.72px; margin-top:8.07px;}
      .cd-seg{ flex:1 1 0; max-width:78px; background:rgba(255,248,240,.13); border:1px solid rgba(255,248,240,.38); border-radius:9.72px; padding:6.72px 2.02px 5.38px; text-align:center;}
      .cd-num{ display:block; font-size:1.45rem; font-weight:900; line-height:1.05; color:#FFF8F0; font-variant-numeric:tabular-nums;}
      .cd-lab{ display:block; font-size:0.6rem; font-weight:400; letter-spacing:.09em; text-transform:uppercase; color:#FFDCC4; margin-top:1.34px;}
      .pwd-error{ font-weight:400; color:var(--rose-strong); margin:5.38px 0 0; line-height:1.4;}
      .pwd-actions{ display:flex; gap:5.38px 6.48px; flex-wrap:wrap; margin-top:8.07px;}
      .pwd-actions .btn{ flex:1;}
      .picker-screen input[type="password"]{ width:100%; font:inherit; font-size:16px; font-weight:400; padding:7.4px 10.53px; border-radius:9.72px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink);}

      /* ---------- Per-dish scoring tabs (submit-to-lock) ---------- */
      .dish-tabs{ display:flex; flex-wrap:wrap; gap:4.03px 4.86px; margin-top:6.72px;}
      .dish-tab{ font:inherit; font-weight:400; font-size:0.7627rem; background:var(--surface); color:var(--ink-soft);
        border:1.5px solid var(--line); border-radius:809.19px; padding:5.38px 10.53px; cursor:pointer; min-height:32.4px;}
      .dish-tab[aria-selected="true"]{ background:var(--accent); border-color:var(--accent); color:#FFF7EA;}
      @media (prefers-color-scheme: dark){ .dish-tab[aria-selected="true"]{ color:#2A1808;} }
      .dish-tab .tab-check{ color:var(--sage-strong); font-weight:400;}
      .dish-tab[aria-selected="true"] .tab-check{ color:inherit;}
      .submit-row{ margin-top:6.72px;}
      .waiting-line{ background:var(--surface); border:1.5px dashed var(--line); border-radius:var(--radius); padding:10.76px 11.34px; text-align:center; font-weight:400; color:var(--muted); margin-top:4.71px; line-height:1.4;}
      .end-voting-bar{ margin-top:8.07px;}
      .end-voting-bar .btn{ width:100%;}
      .end-voting-note{ background:var(--sage-bg); border:1.5px solid var(--sage-line); border-radius:var(--radius); padding:9.41px 11.34px; text-align:center; font-weight:400; color:var(--sage-strong); margin-top:8.07px; line-height:1.4;}
      /* Voting tracker (tracker viewers only): one quiet card, no scores */
      .tracker-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:8.07px 11.34px; margin-top:8.07px;}
      .tracker-card h3{ font-size:0.884rem; font-weight:900; margin:0 0 4.03px;}
      .tracker-row{ padding:4.03px 0; border-top:1px dashed var(--line); font-weight:400; color:var(--ink-soft); line-height:1.45; font-size:0.8667rem;}
      .tracker-row:first-of-type{ border-top:0;}
      .tracker-row .tracker-name{ font-weight:400; color:var(--ink);}
      .tracker-row .tracker-done{ font-weight:400; color:var(--sage-strong);}
      .tracker-summary{ font-weight:400; color:var(--ink); padding:4.03px 0; border-top:1px dashed var(--line); line-height:1.45; font-size:0.8667rem;}
      .tracker-quiet{ font-weight:400; color:var(--muted); line-height:1.45; font-size:0.8667rem;}
      /* Tracker search + filters + per-person score tables */
      .tracker-search-row{ display:flex; gap:5.38px 6.48px;}
      .tracker-search-row input[type="search"]{ flex:1 1 auto; width:auto; min-width:0; font:inherit; font-size:16px; font-weight:400; padding:7.4px 10.53px; border-radius:9.72px; border:1.5px solid var(--line); background:var(--surface-2); color:var(--ink); min-height:37.26px;}
      .tracker-search-btn{ flex:none; font:inherit; font-weight:400; font-size:0.78rem; background:var(--accent); color:#FFF7EA; border:1px solid transparent; border-radius:9.72px; padding:7.4px 14.58px; cursor:pointer; min-height:37.26px;}
      @media (prefers-color-scheme: dark){ .tracker-search-btn{ color:#2A1808;} }
      .tracker-filters{ display:flex; flex-wrap:wrap; gap:4.03px 4.86px; margin-top:6.72px;}
      .tracker-filters button{ font:inherit; font-weight:400; font-size:0.7454rem; background:var(--surface); color:var(--ink-soft); border:1.5px solid var(--line); border-radius:809.19px; padding:4.71px 11.34px; cursor:pointer; min-height:32.4px;}
      .tracker-filters button[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:#FFF7EA;}
      @media (prefers-color-scheme: dark){ .tracker-filters button[aria-pressed="true"]{ color:#2A1808;} }
      .tracker-results{ margin-top:4.03px;}
      .tracker-result-btn, .tracker-row-btn{ display:block; width:100%; text-align:left; font:inherit; background:transparent; border:0; border-top:1px dashed var(--line); cursor:pointer; color:inherit; padding:6.05px 1.62px; line-height:1.45; font-size:0.8667rem;}
      .tracker-result-btn .tracker-name, .tracker-row-btn .tracker-name{ font-weight:400; color:var(--ink);}
      .tracker-view-hint{ float:right; font-weight:400; color:var(--accent-strong); font-size:0.6934rem; margin-left:8.1px;}
      .tracker-none{ font-weight:400; color:var(--muted); margin:6.72px 0 1.34px; line-height:1.45; font-size:0.8667rem;}
      .tracker-back-row{ margin-top:8.07px;}
      .tracker-detail-title{ font-size:1.0228rem; font-weight:900; margin:0 0 1.34px; line-height:1.3;}
      .tracker-detail-sub{ font-weight:400; color:var(--muted); font-size:0.8667rem; margin:0 0 4.03px; line-height:1.4;}
      .tracker-table{ width:100%; border-collapse:collapse; font-size:0.7974rem;}
      .tracker-table th, .tracker-table td{ padding:4.03px 3.24px; border-top:1px dashed var(--line); line-height:1.35; vertical-align:top;}
      .tracker-table thead th{ border-top:0; font-size:0.624rem; font-weight:400; letter-spacing:.03em; text-transform:uppercase; color:var(--muted);}
      .tracker-table .t-dish{ font-weight:400; color:var(--ink); text-align:left; word-break:break-word;}
      .tracker-table .t-num{ text-align:center; font-weight:400; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap;}
      .tracker-table .t-score{ text-align:center; font-weight:400; color:var(--ink); font-variant-numeric:tabular-nums;}
      .tracker-table .t-empty{ color:transparent;}
      .tracker-big-count{ font-size:1.0228rem; font-weight:400; line-height:1.2; margin:0 0 6.72px; color:var(--ink);}
      .tracker-big-count .tracker-big-of{ color:var(--muted); font-size:0.7974rem;}
      .tracker-unit{ display:block; font-weight:400; color:var(--muted); font-size:0.7974rem; margin-top:0.67px;}
      .tracker-status{ float:right; font-weight:400; font-variant-numeric:tabular-nums; margin-left:8.1px;
        background:var(--mustard-bg); border:1.5px solid var(--mustard-line); color:var(--mustard-strong);
        border-radius:809.19px; padding:1.34px 8.91px; font-size:0.6934rem; line-height:1.5;}
      .tracker-status.done{ background:var(--sage); border-color:var(--sage); color:#FFFFFF;}
      @media (prefers-color-scheme: dark){ .tracker-status.done{ color:#22300F;} }
      .tracker-row-btn.is-finished{ background:var(--sage-bg); border-radius:8.1px;}
      .locked-note{ font-weight:400; color:var(--sage-strong); margin:6.05px 0 0; line-height:1.4;}
      .submit-err{ font-weight:400; color:var(--rose-strong); margin:6.05px 0 0; line-height:1.4;}
      .crit-row input:disabled, .score-row input:disabled{ opacity:.6;}

      /* ---------- Info ---------- */
      .info-grid{ display:grid; gap:6.72px 8.1px; margin-top:8.07px;}
      @media (min-width:640px){ .info-grid{ grid-template-columns:1fr 1fr;} }
      .info-card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:8.07px 11.34px;}
      /* Collapsible Info cards (Anthony, 2026-11-27): every card
         starts COLLAPSED; its header is a full-width tappable
         button — section title plus a chevron at the right edge,
         the same chevron language as the schedule meal expander
         (down when closed, rotating up when open). Tapping
         toggles the body in place; open state is session-only
         (state.infoOpen), never stored. */
      .info-card h2{ margin:0;}
      .info-card-head{ display:flex; align-items:center; gap:6.05px 7.29px; width:100%; background:none; border:0; padding:0; margin:0; font:inherit; font-size:1.0228rem; font-weight:900; line-height:1.25; color:var(--ink); text-align:left; cursor:pointer; -webkit-tap-highlight-color:transparent;}
      .info-card-head::before{ content:""; width:10px; height:10px; border-radius:50%; background:var(--accent); flex:none;}
      .info-grid .info-card:nth-child(2) .info-card-head::before{ background:var(--sage);}
      .info-grid .info-card:nth-child(3) .info-card-head::before{ background:var(--mustard);}
      .info-grid .info-card:nth-child(4) .info-card-head::before{ background:var(--sage);}
      .info-chev{ flex:none; margin-left:auto; display:inline-flex; align-items:center; justify-content:center; color:var(--accent-strong);}
      .info-chev svg{ width:16px; height:16px; flex:none; transition:transform .18s ease;}
      .info-card.is-open .info-chev svg{ transform:rotate(180deg);}
      @media (prefers-reduced-motion: reduce){ .info-chev svg{ transition:none;} }
      .info-card-body{ margin-top:4.71px;}
      .info-card-body[hidden]{ display:none;}
      .kv{ display:flex; justify-content:space-between; gap:9.41px 11.34px; padding:4.03px 0; border-top:1px dashed var(--line);}
      .kv:first-of-type{ border-top:0;}
      .kv .k{ font-weight:400; color:var(--muted);}
      .kv .v{ font-weight:400; text-align:right;}
      .kv .v small{ display:block; font-weight:400; color:var(--muted); font-size:0.7974rem;}
      .car-list{ list-style:none; margin:0; padding:0; display:grid; gap:0;}
      .car-list li{ display:flex; justify-content:space-between; gap:8.07px 9.72px; padding:3.36px 0; border-top:1px dashed var(--line); font-weight:400;}
      .car-list li:first-child{ border-top:0;}
      .car-list .drv{ font-weight:400;}
      .car-list .car{ color:var(--muted); text-align:right;}

      /* ---------- Map (original resort map image + soft overlay) ---------- */
      .map-frame{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:8.07px; margin-top:8.07px; box-shadow:var(--shadow); cursor:zoom-in; -webkit-tap-highlight-color:transparent;}
      .map-img-wrap{ position:relative;}
      .map-img{ display:block; width:100%; height:auto; border-radius:4.04px;}
      /* Click-to-show controls under the map (Anthony, 2026-11-27):
         the units as SMALL compact cards in a tight grid — kept
         deliberately small so the map stays on screen while
         tapping — plus a light meal-locations list. A selected
         card / row gets the accent wash; the map highlight itself
         is the soft translucent wash below. */
      .map-unit-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:6.05px; margin-top:8.07px;}
      .map-unit-card{ font:inherit; text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:10px; padding:6.05px 8.07px; cursor:pointer; -webkit-tap-highlight-color:transparent; box-shadow:var(--shadow); min-width:0;}
      .map-unit-card .mu-name{ display:block; font-size:0.8rem; font-weight:900; color:var(--ink); line-height:1.2; white-space:nowrap;}
      .map-unit-card .mu-room{ display:block; font-size:0.66rem; font-weight:600; color:var(--muted); line-height:1.3; margin-top:1.35px;}
      .map-unit-card.is-sel{ background:var(--accent-soft); border-color:var(--accent);}
      .map-unit-card.is-sel .mu-room{ color:var(--accent-strong);}
      .map-meal-list{ margin-top:8.07px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
      .map-meal-row{ display:flex; align-items:center; gap:8.07px; width:100%; padding:8.07px 11.34px; font:inherit; text-align:left; background:none; border:0; border-top:1px solid var(--line); color:var(--ink);}
      .map-meal-row:first-child{ border-top:0;}
      button.map-meal-row{ cursor:pointer; -webkit-tap-highlight-color:transparent;}
      .map-meal-row .mm-name{ font-size:0.85rem; font-weight:900; white-space:nowrap;}
      .map-meal-row .mm-loc{ margin-left:auto; font-size:0.78rem; font-weight:600; color:var(--ink-soft); text-align:right;}
      .map-meal-row .mm-hint{ font-size:0.66rem; font-weight:700; color:var(--accent-strong); white-space:nowrap;}
      .map-meal-row.is-sel{ background:var(--accent-soft);}
      /* Overlay marks (Anthony, 2026-11-27): NO pins and nothing
         opaque sitting on the map. A marked building gets a soft
         translucent highlighter wash over its own rectangle — the
         building and its label stay fully readable underneath —

         FIXED 7px bold (never rem, so nothing scales it up),

         badge, in both views (Anthony, 2026-11-27: highlight

      function whoMatches(who, person){

      function myDutiesSplit(){

      /* ================= Camp time =================

      function campNow(){
        var parts = {};
        try {
          var dtf = new Intl.DateTimeFormat("en-US", { timeZone: CAMP_DATA.meta.timezone, year:"numeric", month:"numeric", day:"numeric", hour:"numeric", minute:"numeric", hour12:false, weekday:"short" });
          dtf.formatToParts(new Date()).forEach(function(p){ parts[p.type] = p.value; });
        } catch(e) {
          var n = new Date();
          parts = { year:n.getFullYear(), month:n.getMonth()+1, day:n.getDate(), hour:n.getHours(), minute:n.getMinutes(), weekday:"" };
        }
        var y = +parts.year, mo = +parts.month, d = +parts.day;
        var hour = +parts.hour; if (hour === 24) hour = 0;
        var mins = hour * 60 + (+parts.minute);
        var dayIdx;
        if (y === 2026 && mo === 11 && d >= 27 && d <= 29) dayIdx = d - 27;
        else {
          var campStart = Date.UTC(2026, 10, 27), thisDay = Date.UTC(y, mo - 1, d);

        }
        var daysUntil = Math.round((Date.UTC(2026, 10, 27) - Date.UTC(y, mo - 1, d)) / 86400000);
        var label = (parts.weekday ? parts.weekday + ", " : "") + "Nov " + d + " · " + fmt(mins) + " camp time";
        return { dayIdx: dayIdx, mins: mins, key: dayIdx * 1440 + mins, daysUntil: daysUntil, label: label };
