      }
      function campNow(){
        if (SIM) {
          var sy = SIM.y, smo = SIM.mo, sd = SIM.d;
          var sMins = SIM.hour * 60 + SIM.minute;
          var sDayIdx;
          if (sy === 2026 && smo === 11 && sd >= 27 && sd <= 29) sDayIdx = sd - 27;
          else {
            var sStart = Date.UTC(2026, 10, 27), sThis = Date.UTC(sy, smo - 1, sd);
            sDayIdx = sThis < sStart ? -1 : 3;
          }
          var sDaysUntil = Math.round((Date.UTC(2026, 10, 27) - Date.UTC(sy, smo - 1, sd)) / 86400000);
          var wdShort = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(Date.UTC(sy, smo - 1, sd)).getUTCDay()];
          var monShort2 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][smo - 1];
          var sLabel = wdShort + ", " + monShort2 + " " + sd + " \u00b7 " + fmt(sMins) + " camp time";
          return { dayIdx: sDayIdx, mins: sMins, key: sDayIdx * 1440 + sMins, daysUntil: sDaysUntil, label: sLabel, sim: true };
        }
        var parts = {};
        try {
          var dtf = new Intl.DateTimeFormat("en-US", { timeZone: CAMP_DATA.meta.timezone, year:"numeric", month:"numeric", day:"numeric", hour:"numeric", minute:"numeric", hour12:false, weekday:"short" });
          dtf.formatToParts(new Date()).forEach(function(p){ parts[p.type] = p.value; });
        } catch(e) {
          var n = new Date();
          parts = { year:n.getFullYear(), month:n.getMonth()+1, day:n.getDate(), hour:n.getHours(), minute:n.getMinutes(), weekday:"" };
        }
        var y = +parts.year, mo = +parts.month, d = +parts.day;
        var hour = +parts.hour; if (hour === 24) hour = 0;
        var mins = hour * 60 + (+parts.minute);
        var dayIdx;
        if (y === 2026 && mo === 11 && d >= 27 && d <= 29) dayIdx = d - 27;
        else {
          var campStart = Date.UTC(2026, 10, 27), thisDay = Date.UTC(y, mo - 1, d);
          dayIdx = thisDay < campStart ? -1 : 3;
        }
        var daysUntil = Math.round((Date.UTC(2026, 10, 27) - Date.UTC(y, mo - 1, d)) / 86400000);
        var label = (parts.weekday ? parts.weekday + ", " : "") + "Nov " + d + " · " + fmt(mins) + " camp time";
        return { dayIdx: dayIdx, mins: mins, key: dayIdx * 1440 + mins, daysUntil: daysUntil, label: label };
      }
      /* Default Schedule day = current camp day (America/Los_Angeles):
         before camp -> Friday (0), during camp -> that day, after -> Sunday (2). */
      function defaultDayIdx(){
        var n = campNow();
        if (n.dayIdx < 0) return 0;
        if (n.dayIdx > 2) return 2;
        return n.dayIdx;
      }

      /* Hard gate: with no user picked, only the title, welcome line
         and the name picker are usable — tabs and all tab content stay
         hidden/inaccessible until a name is chosen. */
      function applyGate(){
        var gated = !state.user;
        document.body.classList.toggle("gated", gated);
        var tb = document.querySelector(".tabbar");
        if (tb) tb.hidden = gated;

      function passwordFor(person){
        if (!person) return "";

      function showPasswordScreen(person){

      function tryUnlockPassword(){
        if (!pendingUser) return;

      /* Changing user clears the current pick first, so the page

      /* ================= Name picker
 ================= */
      /* Picker results render ONLY on an explicit search submission
         (Enter key or Search button) — never on open and never live
         while typing. Editing the search text afterwards leaves the
         last submitted results untouched until the next submission. */
      function renderPickerList(filter){
        var q = (filter || "").trim().toLowerCase();

        document.querySelectorAll("[data-pick]").forEach(function(b){
          b.addEventListener("click", function(){
            var p = PEOPLE.filter(function(x){ return x.display === b.getAttribute("data-pick"); })[0];

      function respRowHtml(d){

      /* ================= Rendering: Schedule ================= */
      /* Camp ends Sunday 12:00 PM: Sunday's last event (11:45 AM,
         "Get ready to leave") stays Current only until then;
         from this key on, everything is Past and Sunday shows the
         closing card. All other events run until the next event
         starts — a day's last event runs until the NEXT day's
         first event, so Friday Sleep Time stays Current overnight
         (11 PM, 2 AM, 6 AM) until Saturday 8:30 AM takes over. */
      var CAMP_END_KEY = 2 * 1440 + 12 * 60;
      /* Status is computed on the global camp timeline (keys =
         day * 1440 + minutes), not per-day in isolation:
         before a day's first event, that first event is "upnext";
         an event is "current" from its start until the next
         event's start (or CAMP_END_KEY for Sunday's last). */
      function evStatus(e, dayIdx, nowInfo, isFirst, endKey){
        var nowKey = nowInfo.key;
        var startKey = dayIdx * 1440 + e.t;
        if (nowKey >= CAMP_END_KEY) return "past";
        if (nowKey < startKey) return isFirst ? "upnext" : "next";
        if (nowKey < endKey) return "current";
        return "past";
      }
      function evButton(e, dayIdx, nextT, nowInfo, status){
        var isNow = status === "current";
        var isUpNext = status === "upnext";
        var mine = hasAssignmentOnEvent(e);
        var h = '<div class="ev' + (isNow ? " is-now is-current-filled" : "") + (isUpNext ? " is-upnext" : "") + (mine && !isNow && !isUpNext ? " is-mine" : "") + '" id="ev-' + e.id + '">'
          + '<span class="ev-time">' + fmt(e.t) + (nextT !== null ? '<span class="to">to ' + fmt(nextT) + "</span>" : "") + "</span>"
          + '<span class="ev-main">'
          + (isNow ? '<span class="now-flag">Now</span>' : "")
          + (isUpNext ? '<span class="upnext-flag">Up next \u00b7 starts ' + fmt(e.t) + "</span>" : "")
          + '<span class="ev-title">' + esc(e.title) + "</span>"
          + descriptionInlineHtml(e)
          + eventTagsHtml(e)
          + "</span></div>";
        return h;
      }
      function daySection(dayIdx, nowInfo){
        var d = DAYS[dayIdx];
        var isToday = nowInfo.dayIdx === dayIdx;
        var list = dayIdx === 1 ? satList(state.track) : DAY_EVENTS[dayIdx];
        var buckets = { past: [], current: [], next: [] };
        list.forEach(function(e, i){
          var nextT = i + 1 < list.length ? list[i + 1].t : null;
          /* Global end: next event in this day, else the next
             day's first event (overnight run for the last event),
             else the camp-end cutoff for Sunday's last event. */
          var endKey;
          if (nextT !== null) endKey = dayIdx * 1440 + nextT;
          else if (dayIdx === 2) endKey = CAMP_END_KEY;
          else { var nd = eventsFor(dayIdx + 1, state.track); endKey = (dayIdx + 1) * 1440 + nd[0].t; }
          var st = evStatus(e, dayIdx, nowInfo, i === 0, endKey);
          /* Up next sits in the Next section as its first item. */
          buckets[st === "upnext" ? "next" : st].push({ e: e, nextT: nextT, status: st });
        });
        var h = '<section class="day-section day-' + dayIdx + '"><div class="day-head"><h2>' + d.full + "</h2>" + (isToday ? '<span class="today-flag">Today</span>' : "") + "</div>";
        if (dayIdx === 2 && nowInfo.key >= CAMP_END_KEY) {
          h += '<div class="camp-over-card">Camp\u2019s over \u2014 see you next time!</div>';
        }
        function secHtml(key, label, cls){
          if (!buckets[key].length) return "";
          var s = '<div class="sched-sec sched-sec-' + cls + '"><h3 class="sched-sec-h">' + label + '</h3><div class="ev-list">'
            + buckets[key].map(function(x){ return evButton(x.e, dayIdx, x.nextT, nowInfo, x.status); }).join("")
            + "</div></div>";
          return s;
        }
        h += secHtml("past", "Past", "past");
        h += secHtml("current", "Current", "current");
        h += secHtml("next", "Next", "next");
        return h + "</section>";
      }
      /* Auto-scroll to the Current activity in Schedule: after any
         Schedule render (tab click, landing after picking/changing
         user, day or Track switch, the 30s refresh, simulation time
         change, page load/refresh), smoothly bring the Current card
         to the top of the visible area, just below the sticky tab
         bar with a small comfortable gap. If the shown day has no
         Current activity, do nothing — the view stays where the
         caller's normal behaviour leaves it (top on tab entry).
         Between those trigger moments nothing touches the scroll
         position, so the user can scroll freely. */
      function scrollScheduleToCurrent(){
        window.requestAnimationFrame(function(){
          window.requestAnimationFrame(function(){
            if (state.view !== "schedule") return;
            var viewEl = document.getElementById("view-schedule");
            if (!viewEl || viewEl.hidden) return;
            var area = document.getElementById("scheduleArea");
            if (!area) return;
            var cur = area.querySelector(".ev.is-current-filled") || area.querySelector(".sched-sec-current .ev") || area.querySelector(".ev.is-upnext");
            if (!cur) return;
            var tabbar = document.querySelector(".tabbar");
            var offset = 14;
            if (tabbar && !tabbar.hidden && tabbar.offsetHeight) offset = 8 + tabbar.offsetHeight + 12;
            var target = cur.getBoundingClientRect().top + window.pageYOffset - offset;
            if (target < 0) target = 0;
            var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            window.scrollTo({ top: target, behavior: reduced ? "auto" : "smooth" });
          });
        });
      }
      function renderSchedule(){
        var nowInfo = campNow();
        /* Single-day view only — no whole-camp view. Guard any stale
           "all" value by falling back to the current day. */
        if (state.day === "all" || ["0","1","2"].indexOf(String(state.day)) === -1) state.day = defaultDayStr();
        /* Track selector only exists alongside the Saturday schedule. */
        var tb = document.getElementById("trackbar-sched");

        document.getElementById("dayBar").innerHTML =
          DAYS.map(function(d, i){ return '<button data-day="' + i + '" aria-pressed="' + String(String(state.day) === String(i)) + '">' + d.short + " · " + d.date + "</button>"; }).join("");
        document.querySelectorAll(".daybar button").forEach(function(b){
          b.addEventListener("click", function(){ state.day = b.getAttribute("data-day"); state.selected = null; renderSchedule(); });
        });

      /* ================= Rendering: Assignments ================= */
      /* Assignments tab: shown for EVERY picked user (all 43 have meal
         assignments) — this tab is never hidden. Top: a "Your group"
         bubble card — group name as title, the group's full people
         list with leader(s) starred + bold on top. Below: their timed
         meal assignments, Upcoming first, Past dimmed at the bottom.
         Bottom: the Groups section (other groups, collapsible). */
      /* Groups roster for the Assignments tab: all five sub groups as
         room-style cards, below the user's own assignments. Leaders
         (CAMP_DATA.subGroupLeaders) sit at the TOP of each list,
         starred + bold like room leaders — Adults has two co-leaders,

         in People-tab order. The picked user's own group card gets
         the sage is-mine treatment used elsewhere. */
      var SUBGROUP_ORDER = ["Moms", "Dads", "Adults", "Youth Brothers", "Youth Sisters"];
      function subgroupMembersOrdered(plural){
        var leaders = leadersForGroup(plural);
        var rest = [];
        CAMP_DATA.people.forEach(function(pp){
          if ((SUBGROUP_PLURAL[pp.subGroup] || null) !== plural) return;
          if (leaders.indexOf(pp.displayName) > -1) return;
          rest.push(pp.displayName);
        });
        return leaders.concat(rest);
      }
      function subgroupCardHtml(plural, big){
        var leaders = leadersForGroup(plural);
        var members = subgroupMembersOrdered(plural);
        var mine = !!(state.user && subGroupPlural(state.user) === plural);
        var occ = members.map(function(dn){

      /* Groups section (Assignments tab): the OTHER groups — never
         the user's own, which sits on top as the "Your group" card.
         Collapsed by default behind a "Show all groups" button, with
         a Collapse control when open — the Rooms tab pattern. With
         no user picked there is no "own" group, so all five list. */
      function groupsSectionHtml(){
        var mine = state.user ? subGroupPlural(state.user) : null;
        var others = SUBGROUP_ORDER.filter(function(g){ return g !== mine; });
        var h = '<div class="resp-sec"><h2>Groups</h2><p>' + (mine ? "The other groups at camp." : "All five groups at camp.") + "</p></div>";
        if (!state.groupsOpen) {
          h += '<div class="actions" style="margin-top:4px"><button class="btn primary" id="showGroupsBtn">Show all groups</button></div>';
        } else {

        }

      }
      function bindGroupsButtons(){
        var sg = document.getElementById("showGroupsBtn");
        if (sg) sg.addEventListener("click", function(){ state.groupsOpen = true; renderAssignments(); });

      function renderAssignments(){
        var area = document.getElementById("assignArea");
        if (!state.user) {
          area.innerHTML = '<div class="prompt-card"><h2>Your assignments</h2>'
            + "<p>Pick your name once and this tab shows your group and the meals your group prepares and cleans up.</p>"
            + '<button class="btn primary" id="assignPickBtn">Pick your name</button></div>'
            + groupsSectionHtml();
          var pb = document.getElementById("assignPickBtn");
          if (pb) pb.addEventListener("click", openPicker);

          return;
        }
        var grp = subGroupPlural(state.user);
        var html = '<div class="resp-sec" style="margin-top:10px"><h2>Your group</h2><p>Everyone in your group, ' + esc(state.user.display) + " — leaders are starred. Your group shares the meal assignments below.</p></div>"
          + '<div style="margin-top:7px">' + subgroupCardHtml(grp, true) + "</div>";
        /* Coordination is a separate Responsibility — assignments
           here are the group duties only, never merged (NO-MERGE). */
        var list = myAssignments();
        var nowInfo = campNow();
        var upcoming = list.filter(function(d){ return nowInfo.key < d.endKey; });
        var past = list.filter(function(d){ return nowInfo.key >= d.endKey; });
        if (upcoming.length) {

      /* ================= Rendering: Competition ================= */

      function competitionTeamFor(person){

      var COMP_START_KEY = 1 * 1440 + 16 * 60 + 30;

      /* Scored dishes: competing teams named by their DISH only.

      function compDishes(){
        var teams = ((CAMP_DATA.competition || {}).teams || []).filter(function(t){ return !!t.dish; });
        var counts = {};
        teams.forEach(function(t){ counts[t.dish] = (counts[t.dish] || 0) + 1; });

      function excludedDishKeysForScope(scopeKey){

      var COMP_VOTES_KEY = "angelsCampCompVotesV3";

      function compAggregates(votes){
        return compDishes().map(function(d){

          (votes.rows || []).forEach(function(r){
            if (r.dish !== d.key) return;
            if (r.ballot) { var t = parseFloat(r.total); if (!isNaN(t)) { jSum += t; jCount++; } }

          });

      /* Per-dish tab selector: one button per dish; a submitted

      var compActiveDish = {};

      /* ================= Final results feed =================

      var RESULTS_GVIZ_URL = "https://docs.google.com/spreadsheets/d/1E6IGjc_HLMZzTRdz6q48DTEpY1gFbOtF12F7nhw4_OY/gviz/tq?tqx=out:json&sheet=Final%20Results";

      function postCloseSignal(){

      function gvCell(row, i){

      function parseGvizResults(text){
        try {
          if (!text) return null;
          var start = text.indexOf("{");
          var end = text.lastIndexOf("}");
          if (start < 0 || end <= start) return null;
          var json = JSON.parse(text.slice(start, end + 1));
          var table = json && json.table;
          if (!table) return null;
          /* Flatten cols (gviz puts sheet row 1 there) + rows
             into one grid so the State row and the header row
             are found wherever gviz placed them. */
          var grid = [];
          if (table.cols && table.cols.length) {
            grid.push(table.cols.map(function(c){ return c && c.label != null && c.label !== "" ? c.label : null; }));
          }
          (table.rows || []).forEach(function(r){
            var n = Math.max(14, r && r.c ? r.c.length : 0);

            for (var i = 0; i < n; i++) arr.push(gvCell(r, i));

      }
      /* ================= Final results: present-card reveal =================
         Shown ONLY from renderCompetition's gated branch (camp
         time past Saturday 5:30 PM AND feed State "final").
         Category tabs (Dessert / Appetizers) switch the whole
         section. Each category has two award cards — Judges'
         Award (highest JudgesAvg) and People's Award (highest
         PeoplesAvg) — that start as wrapped presents: the winner
         is not in the closed card's markup at all. Each card
         needs a random 3–7 taps to open on this device: the
         threshold is drawn once, the first time that card is
         rendered unopened here, and persisted in localStorage
         alongside the reveal state (keyed per category+award),
         so it never changes mid-tapping or on revisit; other
         devices draw their own. Taps shake the card and grow
         CSS cracks as they approach the threshold, and the
         final tap replaces the card with the reveal; the
         opened state persists per device in localStorage,
         keyed per category+award. A tie reveals every tied dish
         as a joint winner. If the signed-in user is on a winning
         team, the revealed card shows a "You won!" banner.
         The whole reveal state is per results GENERATION (the
         feed's Cutoff value): a new closing reseals every card
         with fresh tap counts automatically — see
         syncFinalRevealGeneration below.
         Below the cards, Full standings lists only the active
         category's dishes, sorted by Judges' average. */
      var FINAL_REVEAL_KEY = "angelsCampFinalRevealV1";
      var finalCategory = "dessert";
      var finalTaps = {};
      function loadFinalRevealed(){
        try {
          var o = JSON.parse(localStorage.getItem(FINAL_REVEAL_KEY) || "{}");
          return (o && typeof o === "object" && !Array.isArray(o)) ? o : {};
        } catch(e){ return {}; }
      }
      var finalRevealed = loadFinalRevealed();
      function saveFinalRevealed(){
        try { localStorage.setItem(FINAL_REVEAL_KEY, JSON.stringify(finalRevealed)); } catch(e){}
      }
      /* Random taps needed per card (3–7 inclusive), drawn once
         per card per device and persisted alongside the reveal
         state so a card's threshold never changes mid-tapping
         or on revisit. Different devices draw independently. */
      var FINAL_TAPS_NEEDED_KEY = "angelsCampFinalTapsNeededV1";
      function loadFinalTapsNeeded(){
        try {
          var o = JSON.parse(localStorage.getItem(FINAL_TAPS_NEEDED_KEY) || "{}");
          return (o && typeof o === "object" && !Array.isArray(o)) ? o : {};
        } catch(e){ return {}; }
      }
      var finalTapsNeeded = loadFinalTapsNeeded();
      function saveFinalTapsNeeded(){
        try { localStorage.setItem(FINAL_TAPS_NEEDED_KEY, JSON.stringify(finalTapsNeeded)); } catch(e){}
      }
      function tapsNeededFor(key){
        var n = finalTapsNeeded[key];
        if (!(typeof n === "number" && isFinite(n) && Math.floor(n) === n && n >= 3 && n <= 7)) {
          n = 3 + Math.floor(Math.random() * 5);
          finalTapsNeeded[key] = n;
          saveFinalTapsNeeded();
        }
        return n;
      }
      /* Results generation: the feed's State row carries a
         Cutoff value (column I) — the close timestamp, or a
         far-future date while voting is open. Each distinct
         final Cutoff is a new generation of results, stored
         here alongside the reveal state and the taps-needed
         map. Whenever a fetched FINAL result's generation
         differs from the stored one, BOTH the opened-cards
         state and the taps-needed map are cleared — fresh
         sealed presents with fresh random tap counts — and
         the new generation is stored. Same generation keeps
         everything as-is. Open fetches never clear or store
         anything (presents only render in final anyway), so
         reopening voting alone never reseals a card; the
         reseal lands with the next closing. A device with no
         stored generation yet (every device, the first time
         this runs) treats its first final fetch as a new
         generation, which also reseals presents opened
         before generations existed. Returns true when a
         reset happened, so the fetch can re-render. */
      var FINAL_GENERATION_KEY = "angelsCampFinalGenerationV1";
      function loadFinalGeneration(){
        try {
          var v = localStorage.getItem(FINAL_GENERATION_KEY);
          return (v == null || v === "") ? null : String(v);
        } catch(e){ return null; }
      }
      var finalResultsGeneration = loadFinalGeneration();
      function saveFinalGeneration(){
        try {
          if (finalResultsGeneration == null) localStorage.removeItem(FINAL_GENERATION_KEY);
          else localStorage.setItem(FINAL_GENERATION_KEY, finalResultsGeneration);
        } catch(e){}
      }
      function syncFinalRevealGeneration(parsed){
        if (!parsed || parsed.state !== "final") return false;
        var gen = (parsed.generation != null && String(parsed.generation).trim() !== "") ? String(parsed.generation).trim() : null;
        if (gen == null) return false;
        if (gen === finalResultsGeneration) return false;
        finalRevealed = {};
        saveFinalRevealed();
        finalTapsNeeded = {};
        saveFinalTapsNeeded();
        finalTaps = {};
        finalResultsGeneration = gen;
        saveFinalGeneration();
        return true;
      }
      function finalAwardKey(cat, award){ return cat + ":" + award; }
      function finalCatOf(r){
        var c = String(r.category || "").toLowerCase();
        if (c.indexOf("appet") === 0) return "appetizer";
        if (c.indexOf("dessert") === 0) return "dessert";
        return c;
      }
      /* Match a results-feed dish string back to its competition
         team (for members + category). Feed strings vary: the
         Malaysia dish may lose its curly quotes, and the shared
         Cresent Dough Wraps dish is told apart by the team name
         in parentheses ("(Youth Brothers)" / "(Brothers)"). */
      function dishNormFinal(s){
        return String(s == null ? "" : s).toLowerCase().replace(/[\u201c\u201d\u2018\u2019"']/g, "").replace(/\s+/g, " ").trim();
      }
      function dishBaseFinal(s){
        return dishNormFinal(String(s == null ? "" : s).replace(/\([^)]*\)/g, " "));
      }
      function compTeamsWithDish(){
        return ((CAMP_DATA.competition || {}).teams || []).filter(function(t){ return !!t.dish; });
      }
      function teamForResultDish(dishStr, sameBaseIdx){
        var teams = compTeamsWithDish();
        var raw = String(dishStr == null ? "" : dishStr);
        var i, hits;
        for (i = 0; i < teams.length; i++) if (raw.indexOf(teams[i].name) > -1) return teams[i];
        if (/brother/i.test(raw)) { for (i = 0; i < teams.length; i++) if (teams[i].name === "Youth Brothers") return teams[i]; }
        if (/sister/i.test(raw)) { for (i = 0; i < teams.length; i++) if (teams[i].name === "Youth Sisters") return teams[i]; }
        hits = teams.filter(function(t){ return t.dish === raw; });
        if (hits.length === 1) return hits[0];
        if (hits.length > 1) return hits[sameBaseIdx || 0] || hits[0];
        var base = dishBaseFinal(raw);
        hits = teams.filter(function(t){ return dishBaseFinal(t.dish) === base; });
        if (hits.length === 1) return hits[0];
        if (hits.length > 1) return hits[sameBaseIdx || 0] || hits[0];
        var full = dishNormFinal(raw);
        hits = teams.filter(function(t){ return dishNormFinal(t.dish) === full; });
        if (hits.length) return hits[0];
        return null;
      }
      function enrichFinalRows(rows){
        var baseSeen = {};
        return (rows || []).map(function(r){
          var base = dishBaseFinal(r.dish);
          var idx = baseSeen[base] || 0; baseSeen[base] = idx + 1;
          var team = teamForResultDish(r.dish, idx);
          var cat = finalCatOf(r);
          if (cat !== "dessert" && cat !== "appetizer") cat = team ? team.category : cat;
          var display = r.dish;
          if (team) {
            var dup = compTeamsWithDish().filter(function(t){ return t.dish === team.dish; }).length > 1;
            display = dup ? team.dish + " (" + team.name + ")" : team.dish;
          }
          return { row: r, dish: r.dish, display: display, team: team, category: cat,
            judgesAvg: r.judgesAvg, peoplesAvg: r.peoplesAvg,
            judgesBallots: r.judgesBallots, peoplesVotes: r.peoplesVotes,
            tasteAvg: r.tasteAvg, presAvg: r.presAvg, creatAvg: r.creatAvg, storyAvg: r.storyAvg, rulesAvg: r.rulesAvg };
        });
      }
      function finalWinners(erows, cat, field){
        var best = null;
        erows.forEach(function(e){
          if (e.category === cat && e[field] != null && !isNaN(e[field]) && (best == null || e[field] > best)) best = e[field];
        });
        if (best == null) return { score: null, list: [] };
        return { score: best, list: erows.filter(function(e){
          return e.category === cat && e[field] != null && !isNaN(e[field]) && Math.abs(e[field] - best) < 1e-9;
        }) };
      }
      function finalUserWon(team){
        if (!team || !state.user) return false;
        var ms = team.members || [];
        return ms.indexOf(state.user.display) > -1 || ms.indexOf(state.user.raw) > -1;
      }
      function winnerMembersHtml(team){
        if (!team) return "";
        return '<ul class="occ-list winner-members">' + (team.members || []).map(function(m){
          return "<li>" + esc(m) + "</li>";
        }).join("") + "</ul>";
      }
      function fmtCrit1(n){
        return (n == null || isNaN(n)) ? "\u2014" : Number(n).toFixed(1);
      }
      /* Per-criteria averages as a tidy mini-list: each criterion
         on its OWN line, label left, score right. The only way
         criteria are shown in the Final Results view. */
      function criteriaAvgHtml(e){
        var rows = [
          ["Taste & Texture", e.tasteAvg, 40],
          ["Presentation", e.presAvg, 20],
          ["Creativity & Consideration", e.creatAvg, 15],
          ["Story / Inspiration", e.storyAvg, 10],
          ["Following Rules", e.rulesAvg, 15]
        ];
        var lines = rows.map(function(r){
          return '<div class="crit-line"><span class="crit-label">' + esc(r[0]) + '</span><span class="crit-val">' + fmtCrit1(r[1]) + " / " + r[2] + "</span></div>";
        }).join("");
        return '<div class="crit-list"><div class="crit-list-h">Judges&rsquo; criteria averages</div>' + lines + "</div>";
      }
      function hasAnyCrit(e){
        return [e.tasteAvg, e.presAvg, e.creatAvg, e.storyAvg, e.rulesAvg].some(function(v){ return v != null && !isNaN(v); });
      }
      function awardCardHtml(erows, cat, award){
        var key = finalAwardKey(cat, award);
        var title = award === "judges" ? "Judges&rsquo; Award" : "People&rsquo;s Award";
        var plainTitle = award === "judges" ? "Judges" : "People";
        var catName = cat === "dessert" ? "Dessert" : "Appetizers";
        if (!finalRevealed[key]) {
          var needed = tapsNeededFor(key);
          var taps = finalTaps[key] || 0;
          var crack = "none";
          if (taps > 0) {
            var ratio = taps / needed;
            if (taps >= needed - 1 || ratio >= 0.75) crack = "heavy";
            else if (ratio >= 0.4) crack = "light";
          }
          var prompt = taps === 0 ? "Tap to open!"
            : (taps === needed - 1 ? "One more tap!"
            : (crack === "none" ? "Keep tapping!" : "It&rsquo;s cracking &mdash; tap again!"));
          return '<button type="button" class="award-card present-card present-' + award + '" data-award-card="' + key + '" data-crack="' + crack + '" aria-label="' + plainTitle + '&rsquo;s Award, ' + catName + ' &mdash; tap to open">'
            + '<span class="present-lid"><span class="present-bow" aria-hidden="true"><i class="bow-l"></i><i class="bow-r"></i><i class="bow-knot"></i></span></span>'
            + '<span class="present-cracks" aria-hidden="true"><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i></span>'
            + '<span class="present-body">'
            + '<span class="present-tag"><span class="present-award-name">' + title + '</span><span class="present-cat">' + catName + '</span></span>'
            + '<span class="present-prompt">' + prompt + '</span>'
            + "</span></button>";
        }
        var field = award === "judges" ? "judgesAvg" : "peoplesAvg";
        var win = finalWinners(erows, cat, field);
        var mine = win.list.some(function(e){ return finalUserWon(e.team); });
        /* Winner block order (Anthony): dish name first, then

        var blocks = win.list.map(function(e){

            + '<div class="winner-score"><span class="winner-score-label">Winning score</span> ' + fmtAvg1(win.score) + (award === "judges" ? " / 100" : " / 10") + "</div>"
            + (award === "judges" && hasAnyCrit(e) ? criteriaAvgHtml(e) : "")

          + (mine ? '<span class="sparkles" aria-hidden="true"><i class="sparkle s1"></i><i class="sparkle s2"></i><i class="sparkle s3"></i><i class="sparkle s4"></i><i class="sparkle s5"></i><i class="sparkle s6"></i><i class="sparkle s7"></i></span>' : "")
          + '<div><span class="award-title' + (award === "peoples" ? " award-title-peoples" : "") + '">' + title + '</span><span class="award-cat-line">' + catName + "</span></div>"
          + (win.list.length > 1 ? '<p class="tie-line">It&rsquo;s a tie &mdash; joint winners!</p>' : "")
          + (win.list.length ? blocks : '<p class="winner-none">No scores were counted for this award.</p>')
          + "</article>";
      }
      var finalExpanded = {};
      function finalStandingsHtml(erows, cat){
        /* Standings stay hidden until BOTH award cards in this
           category have been opened on this device. */
        var bothOpen = !!(finalRevealed[finalAwardKey(cat, "judges")] && finalRevealed[finalAwardKey(cat, "peoples")]);
        if (!bothOpen) {
          return '<div class="standings-locked">Open both awards to see the full standings</div>';
        }
        var inCat = erows.filter(function(e){ return e.category === cat; }).slice().sort(function(a, b){
          var ja = (a.judgesAvg == null || isNaN(a.judgesAvg)) ? -Infinity : a.judgesAvg;
          var jb = (b.judgesAvg == null || isNaN(b.judgesAvg)) ? -Infinity : b.judgesAvg;
          if (jb !== ja) return jb - ja;
          var pa = (a.peoplesAvg == null || isNaN(a.peoplesAvg)) ? -Infinity : a.peoplesAvg;

            ? '<div class="stand-detail">' + (hasAnyCrit(e) ? criteriaAvgHtml(e) : '<div class="crit-avg-line">No judges&rsquo; criteria yet.</div>') + membersHtml + "</div>"
            : "";
          return '<div class="stand-card"><button type="button" class="stand-head" data-stand-toggle="' + esc(key) + '" aria-expanded="' + (open ? "true" : "false") + '">'
            + '<span class="stand-dish">' + esc(e.display) + "</span>"
            + '<span class="stand-nums"><span><span class="sb-kind">Judges&rsquo;</span> avg <b>' + fmtAvg1(e.judgesAvg) + '</b></span>'
            + '<span><span class="sb-kind">People&rsquo;s</span> avg <b>' + fmtAvg1(e.peoplesAvg) + "</b></span></span>"
            + '<span class="stand-toggle-hint">' + (open ? "Tap to collapse" : "Tap to see details") + "</span></button>"

      }
      function finalResultsHtml(res){

          + '<div class="final-cat-tabs" role="tablist" aria-label="Results by category">'
          + '<button type="button" role="tab" data-final-cat="dessert" aria-selected="' + (cat === "dessert" ? "true" : "false") + '">Dessert</button>'
          + '<button type="button" role="tab" data-final-cat="appetizer" aria-selected="' + (cat === "appetizer" ? "true" : "false") + '">Appetizers</button></div>'

      function handleAwardTap(key){

      function bindFinalResults(){

          inp.addEventListener("input", function(){
            var dishKey = inp.getAttribute("data-people-dish");
            var n = parseFloat(inp.value);
            if (inp.value !== "" && !isNaN(n)) {
              if (n > 10) inp.value = "10";
              else if (n < 1) inp.value = "1";
            }
            var votes = loadCompVotes();
            setDraft(votes, peopleScope(), dishKey, "peoples", inp.value);
            saveCompVotes(votes);
          });
        });
        document.querySelectorAll("[data-submit-ballot]").forEach(function(btn){
          btn.addEventListener("click", function(){
            submitBallotDish(btn.getAttribute("data-submit-ballot"), btn.getAttribute("data-submit-dish"));
          });
        });
        document.querySelectorAll("[data-submit-people]").forEach(function(btn){
          btn.addEventListener("click", function(){
            submitPeoplesDish(btn.getAttribute("data-submit-people"));
          });
        });
      }
      function renderCompetition(){
        var area = document.getElementById("compArea");
        var C = CAMP_DATA.competition || { introText:"", teams:[] };
        updateCompTab();
        var phase = compPhase();
        var coord = state.user ? isCoordinator(state.user) : false;
        /* AFTER (Sat 5:30 PM on): the tab switches to voting.
           No scores are shown while voting is open; a section
           whose dishes are all submitted shows a waiting line,
           and once the results sheet reads "final" the whole
           tab becomes the Final Results board. Scoring is per-dish: pick a dish tab, fill
           its form, Submit — the dish locks and its tab gains a ✓.
           Each judge ballot belongs to its owner account: only the
           owner sees the forms; the other member of the pair gets
           a note to use the owner's phone. Anthony also gets the
           Children ballot as a separate extra section with its own
           tabs and locks. Everyone else with the tab casts a
           people's vote (judges never get one — the pools stay
           separate). The scoreboard counts submitted rows only. */
        if (phase === "after" && state.user) {
          /* Kick off / refresh the results feed; when its State
             flips to "final" the fetch re-renders this tab.
             (The Voting tracker and End Voting button live on
             the separate Voting Tracker tab now — see
             renderTracker; syncTrackerTab keeps that tab's
             existence in step with this feed.) */
          fetchCompResults();
          syncTrackerTab();
          if (compResults && compResults.state === "final") {
            area.innerHTML = finalResultsHtml(compResults);
            bindFinalResults();
            return;
          }
          /* Voting still open: NO current scores are shown
             anywhere — no scoreboard, averages, counts or
             leaders. Each scoring section the user owns flips
             to a plain waiting line once all its dishes are
             submitted; sections are independent. */
          var votes = loadCompVotes();
          var myBallot = judgeBallotFor(state.user);
          var htmlA = "";
          if (myBallot) {
            if (myBallot.owner === state.user.display) {
              if (scopeAllSubmitted(votes, ballotScope(myBallot.name))) {
                htmlA += '<div class="resp-sec" style="margin-top:10px"><h2>Judges&rsquo; scoring — ' + esc(myBallot.name) + "</h2></div>"
                  + waitingHtml();
              } else {
                htmlA += '<div class="resp-sec" style="margin-top:10px"><h2>Judges&rsquo; scoring — ' + esc(myBallot.name) + "</h2>"
                  + "<p>Score each dish according to the criteria.</p></div>"
                  + dishTabsHtml(ballotScope(myBallot.name), votes)
                  + ballotDishFormHtml(myBallot.name, votes);
              }
            } else {
              var ownerFirst = firstName(myBallot.owner || "");
              htmlA += '<div class="resp-sec" style="margin-top:10px"><h2>Judges&rsquo; scoring — ' + esc(myBallot.name) + "</h2></div>"
                + '<div class="note-card">Your pair&rsquo;s scoring is on ' + esc(ownerFirst) + '&rsquo;s account — please use ' + esc(ownerFirst) + '&rsquo;s phone to score.</div>';
            }
          }
          if (state.user.display === "Anthony") {
            if (scopeAllSubmitted(votes, ballotScope("Children"))) {
              htmlA += '<div class="resp-sec"><h2>Children&rsquo;s votes</h2></div>'
                + waitingHtml();
            } else {
              htmlA += '<div class="resp-sec"><h2>Children&rsquo;s votes</h2>'
                + "<p>Score each dish according to the criteria.</p></div>"
                + dishTabsHtml(ballotScope("Children"), votes)
                + ballotDishFormHtml("Children", votes);
            }
          }
          if (!myBallot) {
            if (scopeAllSubmitted(votes, peopleScope())) {
              htmlA += '<div class="resp-sec" style="margin-top:10px"><h2>People&rsquo;s vote</h2></div>'
                + waitingHtml();
            } else {
              htmlA += '<div class="resp-sec" style="margin-top:10px"><h2>People&rsquo;s vote</h2>'
                + "<p>Please score each dish from 1-10.</p></div>"
                + dishTabsHtml(peopleScope(), votes)
                + peoplesDishFormHtml(votes);
            }
          }
          area.innerHTML = htmlA;
          bindCompVoteInputs();
          return;
        }
        var html = '<p class="resp-intro" style="margin-top:12px">' + esc(C.introText) + "</p>"
          + '<p class="star-note" style="margin-top:6px">Please find Anthony or Mandy if there\'s any questions.</p>';
        if (phase === "during") {
          html += '<div class="comp-timer-card"><p class="comp-timer-label">\u2605 Dinner competition is on \u2605</p>'
            + '<p class="comp-timer-value">Time remaining: <span id="compTimer">' + fmtCountdown(compRemainingSeconds()) + "</span></p>"
            + '<p class="comp-timer-sub">Ends 5:30 PM</p></div>';
        }
        if (!state.user) {
          html += '<div class="prompt-card"><h2>Your team</h2>'
            + "<p>Pick your name once and this tab shows your dinner competition team.</p>"
            + '<button class="btn primary" id="compPickBtn">Pick your name</button></div>';
          area.innerHTML = html + compRulesHtml() + compCriteriaHtml();
          var pb = document.getElementById("compPickBtn");
          if (pb) pb.addEventListener("click", openPicker);
          return;
        }
        var mine = competitionTeamFor(state.user);
        if (mine && coord) {
          /* Coordinators: just the one simple line — no team list. */
          html += '<div class="resp-sec"><h2>Your team</h2></div>'
            + '<div class="coord-line-card">You are a coordinator.</div>';
        } else if (mine) {
          html += '<div class="resp-sec"><h2>Your team</h2></div>'
            + '<div style="margin-top:7px">' + compTeamCardHtml(mine, true, true) + "</div>";
        }
        /* Before and during the competition, the Rules and Judging
           Criteria sections sit directly below the user's own team;
           the other teams come below them. */
        html += compRulesHtml() + compCriteriaHtml();
        var others = (C.teams || []).filter(function(t){ return t !== mine && t.name !== "Extras"; });
        if (others.length) {
          /* Other teams are collapsed by default on every visit —
             one toggle button expands the list, tapping again
             ("Hide other teams") collapses it. */
          html += '<div class="resp-sec"><h2>Other teams</h2></div>';
          if (!state.otherTeamsOpen) {
            html += '<div class="actions" style="margin-top:4px"><button class="btn primary" id="showOtherTeamsBtn">Show other teams</button></div>';
          } else {
            html += '<div class="room-grid">' + others.map(function(t){ return compTeamCardHtml(t, false, false); }).join("") + "</div>"
              + '<div class="actions"><button class="btn ghost" id="hideOtherTeamsBtn">Hide other teams</button></div>';
          }
        }
        area.innerHTML = html;
        bindOtherTeamsButtons();
      }

      /* ================= Rendering: Rooms ================= */
      function roomCard(r, big){
        var num = r.roomNumber ? "Room " + esc(r.roomNumber) : "Room # — added Friday";
        var leaderDisplay = displayName(r.leader, r.unit);
        var occ = r.occupants.map(function(o){
          var dn = displayName(o, r.unit);
          var isLeader = dn === leaderDisplay || o === r.leader;
          return isLeader
            ? '<li class="leader"><strong>★ ' + esc(dn) + "</strong></li>"
            : '<li>' + esc(dn) + "</li>";
        }).join("");
        /* Reservation holder is private: only shown when the holder IS
           the currently picked user, as a small "Reserved by you" note.
           Every other room shows no reservation information at all. */
        var mineRes = !!(state.user && (r.reservationHolder === state.user.display || r.reservationHolder === state.user.raw || firstName(r.reservationHolder) === state.user.display || whoMatches(r.reservationHolder, state.user)));
        return '<article class="room-card' + (big ? " big" : "") + '">'
          + '<div class="r-top"><h3>' + esc(r.unit) + '</h3><span class="room-num">' + num + "</span></div>"
          + '<p class="room-meta">' + esc(r.type) + " · " + r.occupants.length + " people</p>"
          + '<ul class="occ-list">' + occ + "</ul>"
          + (mineRes ? '<p class="res-line">Reserved by you</p>' : "")
          + "</article>";
      }
      function renderRooms(){
        var area = document.getElementById("roomsArea");
        var html = "";
        var mode = state.roomsMode;
        if (mode === "all") {
          html += '<div class="resp-sec" style="margin-top:10px"><h2>All rooms</h2><p>All 8 units.</p></div>'
            + '<div class="room-grid">' + CAMP_DATA.rooms.map(function(r){ return roomCard(r, false); }).join("") + "</div>"
            + (state.user ? '<div class="actions"><button class="btn ghost" id="backMineBtn">My room</button></div>' : "");
        } else {
          /* default / personal view */
          if (state.user) {
            var room = myRoom();
            html += '<div class="resp-sec" style="margin-top:10px"><h2>Your room</h2><p>This is your unit, ' + esc(state.user.display) + " — everyone you&rsquo;re rooming with.</p>"
              + '<p class="star-note">★ = the person who manages / coordinates this unit</p></div>'
              + '<div style="margin-top:7px">' + roomCard(room, true) + "</div>"
              + '<div class="actions"><button class="btn primary" id="seeAllBtn">All rooms</button></div>';
          } else {
            html += '<div class="prompt-card"><h2>Find your room fast</h2>'
              + "<p>Pick your name once and this tab opens on your own room. You can still search for anyone or see all rooms below.</p>"
              + '<button class="btn primary" id="roomsPickBtn">Pick your name</button></div>'
              + '<div class="actions"><button class="btn ghost" id="seeAllBtn">All rooms</button></div>';
          }
        }
        /* Find someone — always available under the main view.
           Same two-step pattern as the name picker: typing shows
           NOTHING (no datalist, no live filtering, no live
           results) — Find click or Enter shows the matching names
           as tappable options below the bar, and tapping a name
           shows that person's room card in the results area below
           the search. The main view above (Your room / All rooms)
           is never changed by a search. Rebuilding this view (All
           rooms / My room buttons, re-entering the tab) starts
           with empty find results. */
        html += '<div class="findbar"><label for="findInput">Find someone</label>'
          + '<div class="findrow"><input id="findInput" placeholder="Type a name" autocomplete="off" />'
          + '<button class="btn primary" id="findBtn">Find</button></div>'
          + '<p class="find-msg" id="findMsg">Search any of the ' + CAMP_DATA.generalInfo.people.total + ' campers, then tap a name to see their room below.</p>'
          + '<div class="name-list find-list" id="findList"></div></div>'
          + '<div class="find-result" id="findResult"></div>';
        area.innerHTML = html;
        var sa = document.getElementById("seeAllBtn");
        if (sa) sa.addEventListener("click", function(){ state.roomsMode = "all"; state.foundUnit = null; renderRooms(); window.scrollTo({ top:0, behavior:"smooth" }); });
        var bm = document.getElementById("backMineBtn");
        if (bm) bm.addEventListener("click", function(){ state.roomsMode = "default"; renderRooms(); window.scrollTo({ top:0, behavior:"smooth" }); });
        var rp = document.getElementById("roomsPickBtn");
        if (rp) rp.addEventListener("click", openPicker);
        document.getElementById("findBtn").addEventListener("click", doFind);
        document.getElementById("findInput").addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); doFind(); } });
      }
      /* Step 1 of Find: show the matching names as tappable options
         directly below the search bar — never a jump. Matching is
         the gate's: partial and case-insensitive, against display
         and full names. A new search replaces the previous options
         and any room card the last pick opened. */
      function doFind(){
        var input = document.getElementById("findInput");
        var q = (input ? input.value : "").trim().toLowerCase();
        var msg = document.getElementById("findMsg");
        var list = document.getElementById("findList");
        var result = document.getElementById("findResult");
        if (!list || !result) return;
        result.innerHTML = "";
        if (!q) { list.innerHTML = ""; if (msg) msg.textContent = "Type a name first."; return; }
        var hits = PEOPLE.filter(function(p){ return p.display.toLowerCase().indexOf(q) > -1 || p.name.toLowerCase().indexOf(q) > -1; });
        if (!hits.length) {
          list.innerHTML = '<p class="find-msg" style="grid-column:1/-1;margin:4px 0">No name found</p>';
          if (msg) msg.textContent = "Try a different spelling.";
          return;
        }
        if (msg) msg.textContent = "Tap a name to see their room below.";
        list.innerHTML = hits.map(function(p){
          return '<button type="button" data-find-display="' + esc(p.display) + '" data-find-unit="' + esc(p.unit) + '">' + esc(p.display) + "</button>";
        }).join("");
        list.querySelectorAll("[data-find-display]").forEach(function(b){
          b.addEventListener("click", function(){
            var p = PEOPLE.filter(function(x){ return x.display === b.getAttribute("data-find-display") && x.unit === b.getAttribute("data-find-unit"); })[0];
            if (!p || !p.room) return;
            showFoundRoom(p);
          });
        });
      }
      /* Step 2 of Find: the tapped person's room card appears in
         the results area below the search bar and options list.
         Nothing above the search changes — the signed-in user's
         own room card and the My room / All rooms state stay
         exactly as they were, and there is no scrolling. */
      function showFoundRoom(p){
        var result = document.getElementById("findResult");
        if (!result) return;
        result.innerHTML = '<h3 class="find-result-h">' + esc(p.display) + " is in " + esc(p.room.unit) + "</h3>" + roomCard(p.room, true);
      }

      /* ================= Rendering: Info ================= */
      function kv(k, v, small){
        return '<div class="kv"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + (small ? "<small>" + esc(small) + "</small>" : "") + "</span></div>";
      }
      function renderInfo(){
        var G = CAMP_DATA.generalInfo, M = CAMP_DATA.meta;
        var p = G.people;
        var peopleRows = kv("Total", p.total + " people");
        if (p.adults != null) peopleRows += kv("Adults", String(p.adults));
        else peopleRows += kv("Adults", "approx " + p.adultsApproxFromSheet, "exact split coming on the sheet");
        if (p.youths != null) peopleRows += kv("Youths", String(p.youths));
        if (p.children != null) peopleRows += kv("Children", String(p.children));
        if (p.youths == null && p.children == null) peopleRows += kv("Youths & children", "approx " + p.youthsChildrenApproxFromSheet, "combined for now — split coming later");
        var roomNums = CAMP_DATA.rooms.map(function(r){
          return kv(r.unit + " · " + r.type, r.roomNumber ? "Room " + r.roomNumber : "TBA Friday", r.roomNumber ? "" : "numbers arrive Friday");
        }).join("");
        var cars = CAMP_DATA.cars.map(function(c){
          return '<li><span class="drv">' + esc(c.driver) + '</span><span class="car">' + esc(c.car || "Car TBA") + "</span></li>";
        }).join("");
        document.getElementById("infoArea").innerHTML =
          '<div class="info-grid">'
          + '<div class="info-card"><h2>Key times</h2>'
          + kv("Arrive — Friday Nov 27", G.arrivalTimeFriday)
          + kv("Check-in & settle — Friday", G.checkInFriday)
          + kv("Check-out — Sunday Nov 29", G.checkOutSunday)
          + kv("Get ready to leave — Sunday", G.getReadyToLeaveSunday)
          + kv("Leave — Sunday", G.leaveTimeSunday)
          + kv("Afterwards", "12:00 PM", G.sundayAfterLeave)
          + "</div>"
          + '<div class="info-card"><h2>People</h2>' + peopleRows
          + kv("Units", G.unitsCount + " units")
          + kv("Drivers / cars listed", String(G.driversCarsListed))
          + "</div>"
          + '<div class="info-card"><h2>Room numbers</h2>' + roomNums + "</div>"
          + '<div class="info-card"><h2>Drivers &amp; cars (' + CAMP_DATA.cars.length + ")</h2><ul class=\"car-list\">" + cars + "</ul></div>"
          + "</div>"
          + (isSimActive()
              ? '<div class="sim-entry"><p>Simulation is on — the page is showing a chosen camp moment, not live time. Use the slider in the floating simulation panel to scrub, or exit here.</p>'
                + '<button type="button" class="sim-entry-btn" id="simExitBtnInfo">Exit simulation</button></div>'
              : '<div class="sim-entry"><p>Want to see how the schedule will look at a moment during camp?</p>'
                + '<button type="button" class="sim-entry-btn" id="simEnterBtn">Preview a camp moment (simulation)</button></div>');
        var simIn = document.getElementById("simEnterBtn");
        if (simIn) simIn.addEventListener("click", enterSimulation);
        var simOut = document.getElementById("simExitBtnInfo");
        if (simOut) simOut.addEventListener("click", exitSimulation);
      }

      /* ================= Navigation ================= */
      var VIEWS = ["schedule", "assign", "comp", "tracker", "rooms", "info"];
      function showView(v){
        if (!state.user) { applyGate(); openPicker(); return; }
        if (VIEWS.indexOf(v) === -1) v = "schedule";
        /* Children never land on Competition — fall back to Schedule. */
        if (v === "comp" && state.user.category === "Children") v = "schedule";
        /* The Voting Tracker tab exists only while
           trackerTabAvailable(); a stale request for it falls
           back like the reset conventions: Competition in the
           after phase, Schedule otherwise. */
        if (v === "tracker" && !trackerTabAvailable()) v = compPhase() === "after" ? "comp" : "schedule";
        if (v === "schedule") state.day = defaultDayStr();
        state.view = v;
        VIEWS.forEach(function(name){
          var viewEl = document.getElementById("view-" + name);
          var tabEl = document.getElementById("tab-" + name);
          if (viewEl) viewEl.hidden = name !== v;
          if (tabEl) tabEl.setAttribute("aria-selected", String(name === v));
        });
        if (v === "schedule") renderSchedule();
        if (v === "assign") renderAssignments();
        if (v === "comp") renderCompetition();
        if (v === "tracker") renderTracker();
        if (v === "rooms") renderRooms();
        if (v === "info") renderInfo();
        syncTrackerTab();
        if (v === "schedule") {
          /* renderSchedule already queued the auto-scroll to the
             Current activity (or the Up next card when the day
             hasn't started); only fall back to the top when the
             shown day has neither — e.g. the camp-over state. */
          var hasHighlight = !!document.querySelector("#scheduleArea .ev.is-current-filled") || !!document.querySelector("#scheduleArea .ev.is-upnext");
          if (!hasHighlight) window.scrollTo({ top: 0, behavior: "smooth" });
        } else {
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      }
      function bindEventButtons(root){ /* schedule rows are display-only; tabs are the navigation */ }
      function syncTrackButtons(){
        document.querySelectorAll("[data-track]").forEach(function(b){
          b.setAttribute("aria-pressed", String(b.getAttribute("data-track") === state.track));
        });
      }
      /* Full reset when the picked person changes (including first pick):
         behave as if the page was freshly opened for the new person. */
      function resetForNewUser(p){
        pendingUser = null;
        saveUser(p);
        state.day = defaultDayStr();
        state.selected = null;
        state.track = defaultTrackFor(p);
        saveTrack(state.track);
        state.roomsMode = "default";
        state.groupsOpen = false;
        state.otherTeamsOpen = false;
        state.foundUnit = null;
        state.foundName = null;
        var searchEl = document.getElementById("pickerSearch");
        if (searchEl) searchEl.value = "";
        clearPickerResults();
        var findEl = document.getElementById("findInput");
        if (findEl) findEl.value = "";
        closePicker();
        syncTrackButtons();
        renderHeader();
        showView("schedule");
        /* No scroll-to-top here: showView/renderSchedule handle it —
           auto-scroll to Current when there is one, top otherwise. */
      }
      function refreshAll(){
        renderHeader();
        syncTrackerTab();
        if (state.view === "schedule") renderSchedule();
        if (state.view === "assign") renderAssignments();
        if (state.view === "comp") renderCompetition();
        if (state.view === "tracker") renderTracker();
        if (state.view === "rooms") renderRooms();
        if (state.view === "info") renderInfo();
      }

      document.querySelectorAll(".tabbar button").forEach(function(b){
        b.addEventListener("click", function(){ showView(b.getAttribute("data-view")); });
      });
      document.querySelectorAll("[data-track]").forEach(function(b){
        b.addEventListener("click", function(){
          state.track = b.getAttribute("data-track");
          saveTrack(state.track);
          syncTrackButtons();
          if (state.view === "schedule") renderSchedule();
        });
      });

      /* ================= Init ================= */
      state.user = loadUser();
      state.day = defaultDayStr();
      state.track = loadTrack() || defaultTrackFor(state.user);
      renderHeader();
      applyGate();
      if (state.user) renderSchedule();
      syncTrackButtons();
      if (!state.user) openPicker();
      setInterval(function(){ if (state.user && state.view === "schedule") renderSchedule(); }, 30000);
      /* Competition clock: every second, refresh the flashing tab
         state and the countdown; when the phase flips (into or out
         of the 4:30–5:30 PM window), re-render the Competition tab
         if it is open so the timer / scoring / done states land
         without a manual refresh. In simulation the countdown is
         frozen at the simulated moment, so only phase flips (from
         scrubbing) matter — those already re-render via
         setSimFromOffset, and this stays harmless. */
      var lastCompPhase = compPhase();
      setInterval(function(){
        updateCompTab();
        /* Keeps the Voting Tracker tab's existence current:
           it appears the moment the after phase begins (for a
           tracker viewer, state still open) and vanishes when
           the feed flips to final, whoever's tab is showing. */
        if (state.user) syncTrackerTab();
        var ph = compPhase();
        if (ph !== lastCompPhase) {
          lastCompPhase = ph;
          if (state.user && state.view === "comp") renderCompetition();
          else if (state.user && state.view === "tracker") renderTracker();
          return;
        }
        if (ph === "during" && !SIM) {
          var tEl = document.getElementById("compTimer");
          if (tEl) tEl.textContent = fmtCountdown(compRemainingSeconds());
        }
      }, 1000);
      /* Final results polling: in the after phase, while the
         Competition or Voting Tracker tab is the active tab and
         the page is visible, check the results sheet about every
         20 seconds (renderCompetition / renderTracker also fetch
         once on entering the phase / switching to the tab). When
         the sheet's State flips to "final", fetchCompResults
         re-renders the Competition tab into the Final Results
         board automatically — and a user sitting on the Tracker
         tab is switched over to it as that tab disappears.
         Polls the same way in simulation — the sheet is real
         either way. */
      setInterval(function(){
        if (compPhase() !== "after") return;
        if (!state.user || (state.view !== "comp" && state.view !== "tracker")) return;
        if (typeof document.hidden === "boolean" && document.hidden) return;
        fetchCompResults();
        if (canViewTracker()) fetchTrackerResponses();
      }, 20000);
    })();
    </script>
  </body>
</html>
