      /* ================= Rendering: Schedule ================= */
      /* Camp ends Sunday 12:00 PM: Sunday's last event (11:45 AM,
         "Get ready to leave") stays Current only until then;
         from this key on, everything is Past and Sunday shows the
         closing card. All other events run until the next event
         starts — a day's last event runs until the NEXT day's
         first event, so Friday Sleep Time stays Current overnight
         (11 PM, 2 AM, 6 AM) until Saturday 8:30 AM takes over. */
      var CAMP_END_KEY = 2 * 1440 + 12 * 60;
      /* Status is computed on the global camp timeline (keys =
         day * 1440 + minutes), not per-day in isolation:
         before a day's first event, that first event is "upnext";
         an event is "current" from its start until the next
         event's start (or CAMP_END_KEY for Sunday's last). */
      function evStatus(e, dayIdx, nowInfo, isFirst, endKey){
        var nowKey = nowInfo.key;
        var startKey = dayIdx * 1440 + e.t;
        if (nowKey >= CAMP_END_KEY) return "past";
        if (nowKey < startKey) return isFirst ? "upnext" : "next";
        if (nowKey < endKey) return "current";
        return "past";
      }
      /* ================= Meal locations =================
         CAMP_DATA.mealLocations maps each meal to its location(s)
         as UNIT references (internal only). Display ALWAYS goes
         through mealLocDisplay (three states): unit assigned and
         its room number known -> "Room <number>"; unit assigned
         but no room number yet -> exactly "room number tba"; no
         unit assigned -> exactly "no unit". A unit number itself
         is never rendered anywhere for a meal location. */
      function roomNumberForUnit(unit){
        if (unit == null || unit === "") return null;
        var key = String(unit).trim();
        var norm = key;
        if (!/^unit\s/i.test(key) && /^\d+$/.test(key)) norm = "Unit " + key;
        var hit = null;
        (CAMP_DATA.rooms || []).forEach(function(r){ if (r.unit === norm || r.unit === key) hit = r; });
        return hit ? (hit.roomNumber || null) : null;
      }
      function mealLocationsFor(meal){
        var hit = null;
        (CAMP_DATA.mealLocations || []).forEach(function(m){ if (m.meal === meal) hit = m; });
        return hit ? (hit.locations || []) : [];
      }
      function mealLocDisplay(loc){
        if (!loc || loc.unit == null || loc.unit === "") return "no unit";
        var rn = roomNumberForUnit(loc.unit);
        return rn ? "Room " + rn : "room number tba";
      }
      /* Parents-category people (Moms / Dads) eat at the Parents
         breakfast location; everyone else at the English one. */
      function isParentsPerson(person){
        if (!person) return false;
        if (person.category === "Parent") return true;
        var g = person.subGroup || "";
        if (g.indexOf("Moms") === 0 || g.indexOf("Dads") === 0) return true;
        return person.defaultTrack === "parents";
      }
      /* The single location text for a one-location meal (the
         Schedule breakfast bubbles do NOT use this — they show
         both locations, labelled, to everyone; see
         mealLocationTagHtml. Kept for the one-location path:
         Parents people would get the Parents location of a
         two-location meal, everyone else the English one.) */
      function mealLocTextForViewer(meal, person){
        var locs = mealLocationsFor(meal);
        if (!locs.length) return "no unit";
        if (locs.length === 1) return mealLocDisplay(locs[0]);
        var want = isParentsPerson(person) ? "Parents" : "English";
        var pick = null;
        locs.forEach(function(l){ if (l.label === want) pick = l; });
        if (!pick) pick = locs[want === "Parents" ? 0 : (locs.length - 1)];
        return mealLocDisplay(pick);
      }
      /* The location text for ONE serving party of a meal duty:
         single-location meals — that location for every party;
         two-location breakfasts — party index 0 (the first-listed
         party: Moms 1 / Dads 1 on Prepare, Moms 2 / Dads 2 on
         Clean up) serves the Parents location, index 1+ (Children
         / Youth Sis / Youth Bros) serves the English location.
         With no index, fall back to the party name (Moms / Dads
         -> Parents, anything else -> English). */
      function mealLocTextForParty(entry, kind, partyName, partyIndex){
        var locs = mealLocationsFor(entry ? entry.meal : null);
        if (!locs.length) return "no unit";
        if (locs.length === 1) return mealLocDisplay(locs[0]);
        var idx;
        if (typeof partyIndex === "number" && partyIndex >= 0) idx = partyIndex;
        else idx = /^(Moms|Dads)/.test(partyName || "") ? 0 : 1;
        if (idx >= locs.length) idx = locs.length - 1;
        return mealLocDisplay(locs[idx]);
      }
      /* MEAL events only — the events that ARE a meal (never a
         prep slot, never a clean-up block, never the Parents
         "Couple Time & Lunch" block: Saturday lunch's meal event
         is the English one). Both Saturday track variants of
         breakfast / dinner are the same meal and both carry the
         tag; breakfast events carry BOTH location bubbles,
         labelled Parents / English, for everyone (below). */
      var MEAL_EVENTS = {
        "fri-dinner": "Friday Dinner",
        "sat-e-breakfast": "Saturday Breakfast",
        "sat-p-breakfast": "Saturday Breakfast",
        "sat-e-lunch": "Saturday Lunch",
        "sat-e-dinner": "Saturday Dinner",
        "sat-p-dinner": "Saturday Dinner",
        "sun-breakfast": "Sunday Breakfast"
      };
      function mealLocationTagHtml(e){
        if (!e) return "";
        var meal = MEAL_EVENTS[e.id];
        if (!meal) return "";
        var locs = mealLocationsFor(meal);
        /* Two-location meals (the breakfasts) are TRANSPARENT in
           the Schedule (Anthony, 2026-11-26 late): no personalising
           — everyone sees BOTH bubbles, one labelled "Parents" and
           one labelled "English", each with its own location (a
           room number, "room number tba" or "no unit").
           One-location meals keep the
           single bubble. (Assignments entries stay personal: they
           show only the location of the party you belong to.) */
        if (locs.length > 1) {
          return locs.map(function(loc, i){
            var lbl = loc.label || (i === 0 ? "Parents" : "English");
            return '<span class="loc-tag" data-meal-loc="' + esc(meal) + '">' + esc(lbl + ": " + mealLocDisplay(loc)) + "</span>";
          }).join("");
        }
        return '<span class="loc-tag" data-meal-loc="' + esc(meal) + '">' + esc(mealLocTextForViewer(meal, state.user)) + "</span>";

      /* ================= Locations (places) =================
         CAMP_DATA.places is the unified locations model (meals
         AND meeting places). A place's display text resolves its
         unit through the same three-state rule as meals
         (mealLocDisplay): "Room <number>" / "room number tba" /
         "no unit". Schedule events whose id maps to a place tag
         (PLACE_EVENT_TAGS) get a location bubble styled exactly
         like the meal bubbles, text = "<place name> · <resolved
         location>". Both meeting places claim both meeting tags,
         and which one a viewer sees splits by SIDE, not by
         language group (Anthony, 2026-11-27): the Break bread
         meeting follows the TRACK being viewed (English track
         -> English meeting room, Parents track -> Parents
         meeting room — each track's event carries its own
         side); Sunday's Worship & Fellowship has no track
         toggle, so it follows the signed-in person — Category
         "Parent" -> Parents meeting room, everyone else ->
         English meeting room. Meeting places display with
         "room" added (placeDisplayName). */
      function placeByName(name){
        var hit = null;
        (CAMP_DATA.places || []).forEach(function(pl){ if (pl.name === name) hit = pl; });
        return hit;
      }
      function placeLocDisplay(place){
        if (!place) return "no unit";
        return mealLocDisplay({ unit: place.unit });

      /* Display name for a place: the meeting places read as
         ROOMS — "English meeting room", "Parents meeting room" —
         so the bubble / list row names a room, not the meeting
         itself (Anthony, 2026-11-27). The stored place names
         stay exactly as the sheet has them; this is display
         text only, used by the schedule bubble, the Info
         Locations list and the Map Locations list. */
      function placeDisplayName(pl){
        if (!pl) return "";
        return / meeting$/.test(pl.name) ? pl.name + " room" : pl.name;
      }
      var PLACE_EVENT_TAGS = {
        "sat-e-bread": "Breakbread",
        "sat-p-bread": "Breakbread",
        "sun-worship": "Worship fellowship"
      };
      function placeForEvent(e, person){
        if (!e) return null;
        var tag = PLACE_EVENT_TAGS[e.id];
        if (!tag) return null;
        var hits = (CAMP_DATA.places || []).filter(function(pl){ return (pl.tags || []).indexOf(tag) !== -1; });
        if (!hits.length) return null;
        if (hits.length === 1) return hits[0];
        /* Both meeting places claim the tag — pick the viewer's
           SIDE (see the section comment): Breakbread follows the
           track, which the event itself carries (the Parents
           track's own Break bread event is sat-p-bread);
           Worship follows the signed-in person's category. */
        var wantLang;
        if (tag === "Breakbread") wantLang = e.id === "sat-p-bread" ? "Parents" : "English";
        else wantLang = (person && person.category === "Parent") ? "Parents" : "English";
        var pick = null;
        hits.forEach(function(pl){ if (pl.lang && pl.lang === wantLang) pick = pl; });
        return pick || hits[0];
      }
      function placeLocationTagHtml(e){
        var place = placeForEvent(e, state.user);
        if (!place) return "";
        return '<span class="loc-tag" data-place-loc="' + esc(place.name) + '">' + esc(placeDisplayName(place) + " · " + placeLocDisplay(place)) + "</span>";

      /* ================= Meal responsibility panels (Schedule expander) =================
         SCHEDULE TAB ONLY (Anthony, 2026-11-26; audience extended
         2026-11-27): the meal-expander viewers — the six
         coordinators (the same six as the competition Coordinators
         team) PLUS Kerry and Winly — can tap any schedule event that carries
         meal duties (EVENT_ASSIGN: the prep slots, the breakfasts
         and the meals themselves, for Friday dinner, Saturday
         breakfast / lunch / dinner and Sunday breakfast) to expand
         a panel directly under the event naming who is responsible
         for that meal: the Prepare group name(s) AND the actual
         people in them, then Clean up the same way — scoped per

         viewers' overview, so it shows the REAL responsible
         parties — the merged youth groups are single groups now,
         and a "Children" duty expands to the six children;
         Saturday Dinner Prepare has no group: its twelve named
         people (preparePeople) split into a "Coordinators" card
         (the six coordinators) and a "Children" card. Each duty
         section renders one card per contributing group/party,

         per-event and session-only (state.mealOpen, in memory —
         never stored), and toggling updates the DOM in place: it
         never re-renders the schedule, so it never triggers the
         schedule auto-scroll or moves the page. A viewer's
         own assignment bubble on the event is untouched. */
      var MEAL_COORDINATORS = ["Anthony", "Rute", "Mandy Chung", "Calvin Ko", "Timothy Ko", "Acacia"];
      /* Schedule-expander viewers (Anthony, 2026-11-27): the six
         coordinators PLUS Kerry and Winly, so they can see who's
         on what duty for meals in the Schedule. This wider set
         gates ONLY the schedule ▾ expander (evButton's tappable
         check). The Assignments "All meal duties" section keeps
         using isMealCoordinator above — coordinators only — and
         Kerry / Winly get no other coordinator feature. */
      var MEAL_EXPANDER_VIEWERS = MEAL_COORDINATORS.concat(["Kerry", "Winly"]);
      var CHEVRON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
      function isMealCoordinator(person){
        return !!(person && MEAL_COORDINATORS.indexOf(person.display) > -1);
      }
      function canSeeMealExpander(person){
        return !!(person && MEAL_EXPANDER_VIEWERS.indexOf(person.display) > -1);
      }
      function mealEntryForEvent(e){
        var link = EVENT_ASSIGN[e.id];
        if (!link) return null;
        var entry = null;
        (CAMP_DATA.responsibilities.mealGroupDuties || []).forEach(function(x){ if (x.meal === link.meal) entry = x; });
        return entry;
      }
      /* Every person in ONE assignment group, members in sheet
         order. The "Children" party expands to the six children
         in sheet order. */
      function peopleForGroup(g){
        if (g === "Children") {
          var out = [];
          CAMP_DATA.people.forEach(function(pp){
            if (pp.category === "Children" && out.indexOf(pp.displayName) === -1) out.push(pp.displayName);
          });
          return out;
        }
        return subgroupMembersOrdered(g);
      }
      /* Every person in the given assignment groups, in group
         order, members in sheet order, de-duplicated. */
      function peopleForGroups(groups){
        var out = [];
        (groups || []).forEach(function(g){
          peopleForGroup(g).forEach(function(dn){ if (out.indexOf(dn) === -1) out.push(dn); });
        });
        return out;
      }
      /* The contributing parties for one duty of a meal entry,
         as [{ name, people }] — one entry per group/party, in
         duty order. Group duties map one party per group name.
         Saturday Dinner Prepare has no group (preparePeople):
         its twelve named people split into two parties — the
         six coordinators under "Coordinators" and the six
         children under "Children" (Anthony, 2026-11-26 late). */
      function mealDutyParties(entry, kind){
        if (kind === "prepare" && entry.preparePeople && entry.preparePeople.length) {
          var coord = [], kids = [], rest = [];
          entry.preparePeople.forEach(function(dn){
            if (MEAL_COORDINATORS.indexOf(dn) > -1) { coord.push(dn); return; }
            var isChild = false;
            CAMP_DATA.people.forEach(function(pp){ if (pp.displayName === dn && pp.category === "Children") isChild = true; });
            if (isChild) kids.push(dn); else rest.push(dn);
          });
          var parties = [];
          if (coord.length) parties.push({ name:"Coordinators", people:coord });
          if (kids.length) parties.push({ name:"Children", people:kids });
          if (rest.length) parties.push({ name:entry.prepareLabel || "Prepare", people:rest });
          return parties;
        }
        var groups = kind === "prepare" ? (entry.prepareGroups || []) : (entry.cleanupGroups || []);
        return groups.map(function(g){ return { name:g, people:peopleForGroup(g) }; });
      }
      /* One duty section (Prepare / Clean up) of an expander:
         the section label, then ONE CARD PER contributing
         group/party — card header = the group name, card body =
         that group's members, one per line in the smaller font.
         A card renders even when only one group does the duty,
         so membership is never a flat undifferentiated list
         (Anthony, 2026-11-26 late). */
      function mealDutyBlockHtml(label, parties, locTexts){
        var pairs = (parties || []).map(function(p, i){
          return { party: p, loc: locTexts ? locTexts[i] : null };
        }).filter(function(x){ return x.party.people && x.party.people.length; });

                + '<ul class="meal-people-rows">' + x.party.people.map(function(dn){ return "<li>" + esc(dn) + "</li>"; }).join("") + "</ul>"

      /* The Prepare / Clean up blocks for one meal-duty entry —
         shared by the Schedule panels and the Assignments
         "All meal duties" section so both always agree and both
         use the per-group card format. The optional scope limits
         which blocks render: "prepare" = Prepare only,
         "cleanup" = Clean up only, anything else (incl. omitted)
         = both. Only the Schedule expander passes a scope; the
         All meal duties cards omit it and always show both. */
      function mealEntryBlocksHtml(entry, rows, scope, withLoc){
        var out = "";

          var prepParties = mealDutyParties(entry, "prepare");

      /* Schedule-expander scoping (Anthony, 2026-11-26; meal

         the crew(s) for the duty that belongs to THAT event —
         Prepare slots (kind "prepare") show Prepare only,
         clean-up-specific blocks (kind "cleanup") show Clean up

         breakfasts, Sat lunch, and both "Dinner & Cleanup"
         events) show BOTH crews. This mirrors the personal
         assignment bubbles exactly (EVENT_ASSIGN /
         myEventAssignHtml use the same kinds). */
      function mealPanelScopeForEvent(e){
        var link = EVENT_ASSIGN[e.id];
        if (!link) return "both";
        if (link.kind === "prepare") return "prepare";
        if (link.kind === "meal") return "both";

      /* The Schedule panel renders the same blocks as the

         meals show that meal's room on every party card — the

      function mealPanelHtml(e){

          + mealEntryBlocksHtml(entry, true, mealPanelScopeForEvent(e), true)

      /* Toggle one event's panel IN PLACE — no re-render, no

      function toggleMealPanel(evEl){

        if (!id) return;

        if (open) state.mealOpen[id] = true; else delete state.mealOpen[id];

      /* ================= Assignments: All meal duties (coordinators only) =================

         mealGroupDuties array order), one card per meal with its

         timing the assignment bubbles use) and a Coming up flag
         on the next one, then the same Prepare / Clean up blocks

      function mealWhenText(entry){
        var td = timedDuty("Meals", entry.meal, entry.cleanupJump || entry.jump);
        return td ? td.when : "";
      }
      function mealStatusFor(entry, nowKey, isNext){
        var prep = timedDuty("Meals", entry.meal, entry.prepareJump || entry.jump);
        var clean = timedDuty("Meals", entry.meal, entry.cleanupJump || entry.jump);
        var start = prep ? prep.key : (clean ? clean.key : null);
        var end = clean ? clean.endKey : (prep ? prep.endKey : null);
        if (start !== null && end !== null && nowKey >= start && nowKey < end) return "now";
        return isNext ? "next" : "";
      }
      function allMealDutiesSectionHtml(){
        if (!isMealCoordinator(state.user)) return "";
        var h = '<div class="resp-sec"><h2>All meal duties</h2><p>Every meal at camp, in time order — who prepares and who cleans up.</p></div>';
        if (!state.allMealsOpen) {
          h += '<div class="actions" style="margin-top:3.32px"><button class="btn primary" id="showAllMealsBtn">Show all meal duties</button></div>';
          return h;
        }
        var entries = CAMP_DATA.responsibilities.mealGroupDuties || [];
        var nowKey = campNow().key;
        var nextIdx = -1;
        entries.forEach(function(entry, i){
          if (nextIdx > -1) return;
          var prep = timedDuty("Meals", entry.meal, entry.prepareJump || entry.jump);
          if (prep && nowKey < prep.key) nextIdx = i;
        });
        h += entries.map(function(entry, i){
          var when = mealWhenText(entry);
          var st = mealStatusFor(entry, nowKey, i === nextIdx);

      }
      function bindAllMealsButtons(){

      function evButton(e, dayIdx, nextT, nowInfo, status){
        var isNow = status === "current";

        var mine = hasAssignmentOnEvent(e);
        /* Meal-expander viewers only (the six coordinators plus

        var tappable = canSeeMealExpander(state.user) && !!EVENT_ASSIGN[e.id];

        var h = '<div class="ev' + (isNow ? " is-now is-current-filled" : "") + (isUpNext ? " is-upnext" : "") + (mine && !isNow && !isUpNext ? " is-mine" : "") + (tappable ? " is-tappable" : "") + (open ? " is-open" : "") + '" id="ev-' + e.id + '"'
          + (tappable ? ' role="button" tabindex="0" aria-expanded="' + String(open) + '" aria-controls="meal-panel-' + e.id + '" data-meal-toggle="' + e.id + '"' : "")
          + '>'
          + '<span class="ev-time">' + fmt(e.t) + (nextT !== null ? '<span class="to">to ' + fmt(nextT) + "</span>" : "") + "</span>"
          + '<span class="ev-main">'
          + (isNow ? '<span class="now-flag">Now</span>' : "")
          + (isUpNext ? '<span class="upnext-flag">Up next \u00b7 starts ' + fmt(e.t) + "</span>" : "")
          + '<span class="ev-title">' + esc(e.title) + "</span>"

          + "</span>"
          + (tappable ? '<span class="meal-chev" aria-hidden="true">' + CHEVRON_SVG + "</span>" : "")

          + (tappable ? mealPanelHtml(e) : "");
        return h;
      }
      function daySection(dayIdx, nowInfo){
        var d = DAYS[dayIdx];
        var isToday = nowInfo.dayIdx === dayIdx;
        var list = dayIdx === 1 ? satList(state.track) : DAY_EVENTS[dayIdx];
        var buckets = { past: [], current: [], next: [] };
        list.forEach(function(e, i){
          var nextT = i + 1 < list.length ? list[i + 1].t : null;
          /* Global end: next event in this day, else the next
             day's first event (overnight run for the last event),
             else the camp-end cutoff for Sunday's last event. */
          var endKey;
          if (nextT !== null) endKey = dayIdx * 1440 + nextT;
          else if (dayIdx === 2) endKey = CAMP_END_KEY;
          else { var nd = eventsFor(dayIdx + 1, state.track); endKey = (dayIdx + 1) * 1440 + nd[0].t; }
          var st = evStatus(e, dayIdx, nowInfo, i === 0, endKey);
          /* Up next sits in the Next section as its first item. */
          buckets[st === "upnext" ? "next" : st].push({ e: e, nextT: nextT, status: st });
        });
        var h = '<section class="day-section day-' + dayIdx + '"><div class="day-head"><h2>' + d.full + "</h2>" + (isToday ? '<span class="today-flag">Today</span>' : "") + "</div>";
        if (dayIdx === 2 && nowInfo.key >= CAMP_END_KEY) {
          h += '<div class="camp-over-card">Camp\u2019s over — see you next time!</div>';
        }
        function secHtml(key, label, cls){
          if (!buckets[key].length) return "";
          var s = '<div class="sched-sec sched-sec-' + cls + '"><h3 class="sched-sec-h">' + label + '</h3><div class="ev-list">'
            + buckets[key].map(function(x){ return evButton(x.e, dayIdx, x.nextT, nowInfo, x.status); }).join("")
            + "</div></div>";
          return s;
        }
        h += secHtml("past", "Past", "past");
        h += secHtml("current", "Current", "current");
        h += secHtml("next", "Next", "next");
        return h + "</section>";

      /* Auto-scroll to the Current activity in Schedule: after any
         Schedule render (tab click, landing after picking/changing
         user, day or Track switch, the 30s refresh, page
         load/refresh), smoothly bring the Current card
         to the top of the visible area, just below the sticky tab
         bar with a small comfortable gap. If the shown day has no
         Current activity, do nothing — the view stays where the
         caller's normal behaviour leaves it (top on tab entry).
         Between those trigger moments nothing touches the scroll
         position, so the user can scroll freely. */
      function scrollScheduleToCurrent(){
        window.requestAnimationFrame(function(){
          window.requestAnimationFrame(function(){
            if (state.view !== "schedule") return;
            var viewEl = document.getElementById("view-schedule");
            if (!viewEl || viewEl.hidden) return;
            var area = document.getElementById("scheduleArea");
            if (!area) return;
            var cur = area.querySelector(".ev.is-current-filled") || area.querySelector(".sched-sec-current .ev") || area.querySelector(".ev.is-upnext");
            if (!cur) return;
            var tabbar = document.querySelector(".tabbar");
            var offset = 14;
            if (tabbar && !tabbar.hidden && tabbar.offsetHeight) offset = 8 + tabbar.offsetHeight + 12;
            var target = cur.getBoundingClientRect().top + window.pageYOffset - offset;
            if (target < 0) target = 0;
            var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            window.scrollTo({ top: target, behavior: reduced ? "auto" : "smooth" });
          });
        });
      }
      function renderSchedule(){
        var nowInfo = campNow();

        if (state.day === "all" || ["0","1","2"].indexOf(String(state.day)) === -1) state.day = defaultDayStr();

        var tb = document.getElementById("trackbar-sched");

        document.getElementById("dayBar").innerHTML =

        document.querySelectorAll(".daybar button").forEach(function(b){
          b.addEventListener("click", function(){ state.day = b.getAttribute("data-day"); state.selected = null; renderSchedule(); });
        });
        var area = document.getElementById("scheduleArea");
        area.innerHTML = daySection(+state.day, nowInfo);
        bindEventButtons(area);
        bindMealPanels(area);

      /* ================= Rendering: Assignments ================= */
      /* Assignments tab: shown for EVERY picked user — this tab is
         never hidden. Top: a "Your group" bubble card — group name
         as title, the group's full people list in sheet order with
         the leader(s) starred at the top. Everyone with a group

         first, Past dimmed at the bottom. Then the Groups section
         (one card per group, all seven groups, collapsible) and
         the Amazing Race section (all six race groups and the
         station masters, collapsible). */
      /* Groups roster for the Assignments tab: the seven assignment
         groups as room-style cards, members in sheet order from
         CAMP_DATA.assignmentGroups. The picked user's own group
         card gets the sage is-mine treatment used elsewhere. */
      var SUBGROUP_ORDER = ["Moms 1", "Moms 2", "Dads 1", "Dads 2", "Youth Bros", "Youth Sis", "Adults"];
      function subgroupMembersOrdered(plural){
        var hit = null;
        (CAMP_DATA.assignmentGroups || []).forEach(function(g){ if (g.name === plural) hit = g; });
        if (hit) return hit.members.slice();
        var rest = [];
        CAMP_DATA.people.forEach(function(pp){
          if ((pp.subGroup || null) !== plural) return;
          rest.push(pp.displayName);
        });
        return rest;
      }
      /* Group lookup: the assignmentGroups entry for a group
         name — its leader field drives the starring below.
         Groups have leaders only; there is no coordinator
         field (removed Nov 26 eve). */
      function assignmentGroupEntry(name){
        var hit = null;
        (CAMP_DATA.assignmentGroups || []).forEach(function(g){ if (g.name === name) hit = g; });
        return hit;
      }
      function subgroupCardHtml(plural, big){
        var members = subgroupMembersOrdered(plural);
        var mine = !!(state.user && subGroupPlural(state.user) === plural);
        /* The group's leader(s) (its leader field in
           assignmentGroups) are members, starred + bold at the
           top of the member list — the competition-card
           convention. */
        var gEntry = assignmentGroupEntry(plural);
        var leaderNames = !gEntry || !gEntry.leader ? [] : (Array.isArray(gEntry.leader) ? gEntry.leader : [gEntry.leader]);
        var occ = members.map(function(dn){
          return leaderNames.indexOf(dn) > -1
            ? '<li class="leader"><strong>★ ' + esc(dn) + "</strong></li>"
            : "<li>" + esc(dn) + "</li>";
        }).join("");
        return '<article class="room-card' + (big ? " big" : "") + (mine ? " is-mine" : "") + '">'
          + '<div class="r-top"><h3>' + esc(plural) + "</h3></div>"
          + '<p class="room-meta">' + members.length + " people</p>"
          + '<ul class="occ-list">' + occ + "</ul>"

      /* Leader note under the "Your group" card (Assignments tab
         only), styled like the Rooms tab's star note: a leader
         sees "You're the leader in this group."; everyone else
         is told who their group's leader(s) are. */
      function yourGroupLeaderNoteHtml(grp){
        var gEntry = assignmentGroupEntry(grp);
        if (!gEntry || !gEntry.leader) return "";
        var leaders = Array.isArray(gEntry.leader) ? gEntry.leader : [gEntry.leader];
        if (!leaders.length || !state.user) return "";
        var text;
        if (leaders.indexOf(state.user.display) > -1) {
          text = "You\u2019re the leader in this group.";
        } else if (leaders.length === 1) {
          text = "\u2605 " + leaders[0] + " is your leader in this group.";
        } else {
          var starred = leaders.map(function(n){ return "\u2605 " + n; });

      /* Groups section (Assignments tab): ALL seven groups, one

      function groupsSectionHtml(){

      function bindGroupsButtons(){

      /* Amazing Race cards: same room-card style as the Groups

      function raceCardHtml(title, members, big){
        var mine = !!(state.user && raceCardTitle(state.user) === title);

      /* Amazing Race section (Race tab): the viewer's own

      function raceSectionHtml(){

      /* Amazing Race FINAL RESULTS — the finished view (Anthony,

      var raceResultExpanded = {};
      function raceResultsHtml(){
        var ar = CAMP_DATA.amazingRace || {};
        var results = (ar.results || []).slice().sort(function(a, b){ return b.score - a.score; });
        var membersByGroup = {};
        (ar.groups || []).forEach(function(g){ membersByGroup[g.name] = g.members || []; });
        var mineTitle = state.user ? raceCardTitle(state.user) : null;
        /* Rankings release (Anthony, 2026-11-27): while the

        var h = '<div class="resp-sec"><h2>Amazing Race</h2><p>The Amazing Race is finished!'

      /* ================= Rendering: Amazing Race ================= */

      var RACE_START_KEY = 1 * 1440 + 14 * 60;

      function raceStartsInSeconds(){

      function fmtRaceCountdown(totalSec){

          [Math.floor(totalSec % 3600 / 60), "minute"],

        units.forEach(function(u){

      function cdSegHtml(id, val, lab){

      /* Scored dishes: competing teams named by their DISH only.

      function compDishes(){

      var COMP_VOTES_KEY = "angelsCampCompVotesV3";

      var FINAL_REVEAL_KEY = "angelsCampFinalRevealV2";

        } catch(e){ return {}; }
      }

      function saveFinalRevealed(){
        try { localStorage.setItem(FINAL_REVEAL_KEY, JSON.stringify(finalRevealed)); } catch(e){}

      var FINAL_TAPS_NEEDED_KEY = "angelsCampFinalTapsNeededV2";
      function loadFinalTapsNeeded(){
        try {
          var o = JSON.parse(localStorage.getItem(FINAL_TAPS_NEEDED_KEY) || "{}");
          return (o && typeof o === "object" && !Array.isArray(o)) ? o : {};
        } catch(e){ return {}; }

      var finalTapsNeeded = loadFinalTapsNeeded();
      function saveFinalTapsNeeded(){

      }

        var n = finalTapsNeeded[key];

      /* Results generation: the feed's State row carries a
         Cutoff value (column I) — the close timestamp, or a
         far-future date while voting is open. Each distinct
         final Cutoff is a new generation of results, stored
         here alongside the reveal state and the taps-needed
         map. Whenever a fetched FINAL result's generation
         differs from the stored one, BOTH the opened-cards
         state and the taps-needed map are cleared — fresh
         sealed presents with fresh random tap counts — and
         the new generation is stored. Same generation keeps
         everything as-is. Open fetches never clear or store
         anything (presents only render in final anyway), so
         reopening voting alone never reseals a card; the
         reseal lands with the next closing. A device with no

      var FINAL_GENERATION_KEY = "angelsCampFinalGenerationV2";

        if (gen == null) return false;
        if (gen === finalResultsGeneration) return false;

        saveFinalRevealed();
        finalTapsNeeded = {};
        saveFinalTapsNeeded();

      function finalAwardKey(cat, award){ return cat + ":" + award; }

        var c = String(r.category || "").toLowerCase();

      /* Match a results-feed dish string back to its competition

         in parentheses ("(Youth Brothers)" / "(Brothers)"). */
      function dishNormFinal(s){
        return String(s == null ? "" : s).toLowerCase().replace(/[\u201c\u201d\u2018\u2019"']/g, "").replace(/\s+/g, " ").trim();
      }
      function dishBaseFinal(s){
        return dishNormFinal(String(s == null ? "" : s).replace(/\([^)]*\)/g, " "));
      }
      function compTeamsWithDish(){
        return ((CAMP_DATA.competition || {}).teams || []).filter(function(t){ return !!t.dish; });
      }
      function teamForResultDish(dishStr, sameBaseIdx){
        var teams = compTeamsWithDish();
        var raw = String(dishStr == null ? "" : dishStr);
        var i, hits;
        for (i = 0; i < teams.length; i++) if (raw.indexOf(teams[i].name) > -1) return teams[i];
        if (/brother/i.test(raw)) { for (i = 0; i < teams.length; i++) if (teams[i].name === "Youth Brothers") return teams[i]; }
        if (/sister/i.test(raw)) { for (i = 0; i < teams.length; i++) if (teams[i].name === "Youth Sisters") return teams[i]; }
        hits = teams.filter(function(t){ return t.dish === raw; });
        if (hits.length === 1) return hits[0];
        if (hits.length > 1) return hits[sameBaseIdx || 0] || hits[0];

      function judgesRewardOpened(){ return !!finalRevealed[JUDGES_REWARD_KEY]; }
      function judgesRewardCardHtml(){
        if (!judgesRewardOpened()) {
          return presentBtnHtml(JUDGES_REWARD_KEY, "judges", "Judges&rsquo; Reward", "The prize",
            "Judges&rsquo; Reward &mdash; tap to open", false);
        }
        return '<article class="award-card award-revealed is-mine-won" data-reveal-card="' + JUDGES_REWARD_KEY + '">'
          + '<span class="sparkles" aria-hidden="true"><i class="sparkle s1"></i><i class="sparkle s2"></i><i class="sparkle s3"></i><i class="sparkle s4"></i><i class="sparkle s5"></i><i class="sparkle s6"></i><i class="sparkle s7"></i></span>'
          + '<div><span class="award-title">Judges&rsquo; Reward</span><span class="award-cat-line">The prize</span></div>'
          + '<button type="button" class="reward-img-btn" data-reward-img aria-label="See the Judges&rsquo; Reward picture full screen">'
          + '<img class="reward-img" src="' + JUDGES_REWARD_IMG + '" alt="Voucher for a hand-pulling noodle lesson and dinner with Rute &amp; Anthony">'
          + "</button>"
          + '<p class="reward-caption">Tap the picture to see it full screen</p>'
          + "</article>"
          + '<div class="lightbox" data-lightbox role="dialog" aria-modal="true" aria-label="Judges&rsquo; Reward picture, full screen">'
          + '<button type="button" class="lightbox-close" data-lightbox-close aria-label="Close full screen picture">&times;</button>'
          + '<img src="' + JUDGES_REWARD_IMG + '" alt="">'
          + "</div>";
      }
      function awardCardHtml(erows, cat, award){
        var key = finalAwardKey(cat, award);
        var isOverall = cat === "overall";
        /* Card names carry the vote context from the tab: the
           Judges' winners are "Dessert Winner" / "Appetizer
           Winner" under a "Judges' Vote" line; the People's
           card is the single "People's Vote Winner" overall. */
        var title = award === "judges"
          ? (cat === "dessert" ? "Dessert Winner" : "Appetizer Winner")
          : "People&rsquo;s Vote Winner";
        var catName = award === "judges" ? "Judges&rsquo; Vote" : "Overall \u00b7 All dishes";
        if (!finalRevealed[key]) {
          var locked = award === "judges" && !judgesRewardOpened();
          return presentBtnHtml(key, award, title, catName,
            title + (locked ? " &mdash; open the reward first" : " &mdash; tap to open"), locked);
        }
        var field = award === "judges" ? "judgesAvg" : "peoplesAvg";
        var win = isOverall ? finalWinnersOverall(erows, field) : finalWinners(erows, cat, field);
        var mine = win.list.some(function(e){ return finalUserWon(e.team); });
        /* Winner block order (Anthony): dish name first, then
           the "You won!" banner when this winner is the viewer's
           own team, then the SCORES (overall + criteria), and
           the team MEMBERS last. Members are NOT rendered at
           all on a block the viewer won (they know their own
           team); on other blocks the names are introduced by

      function standRowHtml(e, rank, isWinner, numsHtml, detailHtml, key){

      /* Standard competition ranking ("1224") for a standings
         list already sorted by its ranking average: rows whose
         averages are exactly equal — the same epsilon equality
         the winner logic uses — SHARE a rank number, and the
         next rank skips the tied slots (10, 10, 9.5, 8 ranks
         1, 1, 3, 4). Unscored rows (null/NaN, sorted last as
         -Infinity) never tie with each other. */
      function compRankList(sorted, field){
        var ranks = [];
        var prevVal = null, prevRank = 0;
        sorted.forEach(function(e, i){
          var v = e[field];
          var val = (v == null || isNaN(v)) ? -Infinity : v;
          var rank = (i > 0 && Math.abs(val - prevVal) < 1e-9) ? prevRank : i + 1;
          ranks.push(rank);
          prevVal = val; prevRank = rank;
        });
        return ranks;
      }
      function finalStandingsHtml(erows, cat){
        /* Judges' standings for one category: every dish in
           the category ranked by Judges' average, winner

           reward is required for both because the winner

          && !!finalRevealed[finalAwardKey(cat, "judges")];

          return "";
        }
        var win = finalWinners(erows, cat, "judgesAvg");
        var inCat = erows.filter(function(e){ return e.category === cat; }).slice().sort(function(a, b){
          var ja = (a.judgesAvg == null || isNaN(a.judgesAvg)) ? -Infinity : a.judgesAvg;
          var jb = (b.judgesAvg == null || isNaN(b.judgesAvg)) ? -Infinity : b.judgesAvg;
          if (jb !== ja) return jb - ja;
          var pa = (a.peoplesAvg == null || isNaN(a.peoplesAvg)) ? -Infinity : a.peoplesAvg;
          var pb = (b.peoplesAvg == null || isNaN(b.peoplesAvg)) ? -Infinity : b.peoplesAvg;
          return pb - pa;
        });
        if (!inCat.length) return '<div class="resp-sec"><h2>Full standings</h2></div><div class="note-card">No dishes in this category.</div>';

           Coordinators card is not listed at all (Anthony,
           2026-11-26 late) — coordinators see only their own
           "You are a coordinator." line above. */
        var others = (C.teams || []).filter(function(t){ return t !== mine && t.name !== "Extras" && t.name !== "Coordinators"; });
        if (others.length) {
          /* Other teams are collapsed by default on every visit —
             one toggle button expands the list, tapping again
             ("Hide other teams") collapses it. */
          html += '<div class="resp-sec"><h2>Other teams</h2></div>';
          if (!state.otherTeamsOpen) {
            html += '<div class="actions" style="margin-top:3.32px"><button class="btn primary" id="showOtherTeamsBtn">Show other teams</button></div>';
          } else {
            html += '<div class="room-grid">' + others.map(function(t){ return compTeamCardHtml(t, false, false); }).join("") + "</div>"
              + '<div class="actions"><button class="btn ghost" id="hideOtherTeamsBtn">Hide other teams</button></div>';
          }
        }
        area.innerHTML = html;
        bindOtherTeamsButtons();
      }

      /* ================= Rendering: Rooms ================= */
      function roomCard(r, big){
        var num = r.roomNumber ? "Room " + esc(r.roomNumber) : "room number tba";
        var leaderDisplay = displayName(r.leader, r.unit);
        var occ = r.occupants.map(function(o){
          var dn = displayName(o, r.unit);
          var isLeader = dn === leaderDisplay || o === r.leader;
          return isLeader
            ? '<li class="leader"><strong>★ ' + esc(dn) + "</strong></li>"
            : '<li>' + esc(dn) + "</li>";
        }).join("");
        /* Reservation holder is private: only shown when the holder IS
           the currently picked user, as a small "Reserved by you" note.
           Every other room shows no reservation information at all. */
        var mineRes = !!(state.user && (r.reservationHolder === state.user.display || r.reservationHolder === state.user.raw || firstName(r.reservationHolder) === state.user.display || whoMatches(r.reservationHolder, state.user)));
        return '<article class="room-card' + (big ? " big" : "") + '">'
          + '<div class="r-top"><h3>' + esc(r.unit) + '</h3><span class="room-num">' + num + "</span></div>"
          + '<p class="room-meta">' + esc(r.type) + " · " + r.occupants.length + " people</p>"
          + '<ul class="occ-list">' + occ + "</ul>"
          + (mineRes ? '<p class="res-line">Reserved by you</p>' : "")
          + "</article>";
      }
      function renderRooms(){
        var area = document.getElementById("roomsArea");
        var html = "";
        var mode = state.roomsMode;
        if (mode === "all") {
          html += '<div class="resp-sec" style="margin-top:8.3px"><h2>All rooms</h2><p>All 8 units.</p></div>'
            + '<div class="room-grid">' + CAMP_DATA.rooms.map(function(r){ return roomCard(r, false); }).join("") + "</div>"
            + (state.user ? '<div class="actions"><button class="btn ghost" id="backMineBtn">My room</button></div>' : "");
        } else {
          /* default / personal view */
          if (state.user) {
            var room = myRoom();
            html += '<div class="resp-sec" style="margin-top:8.3px"><h2>Your room</h2><p>This is your unit, ' + esc(state.user.display) + " — everyone you&rsquo;re rooming with.</p>"
              + '<p class="star-note">★ = the person who manages / coordinates this unit</p></div>'
              + '<div style="margin-top:5.81px">' + roomCard(room, true) + "</div>"
              + '<div class="actions"><button class="btn primary" id="seeAllBtn">All rooms</button></div>';
          } else {
            html += '<div class="prompt-card"><h2>Find your room fast</h2>'
              + "<p>Pick your name once and this tab opens on your own room. You can still search for anyone or see all rooms below.</p>"
              + '<button class="btn primary" id="roomsPickBtn">Pick your name</button></div>'
              + '<div class="actions"><button class="btn ghost" id="seeAllBtn">All rooms</button></div>';
          }
        }
        /* Find someone — always available under the main view.
           Same two-step pattern as the name picker: typing shows
           NOTHING (no datalist, no live filtering, no live
           results) — Find click or Enter shows the matching names
           as tappable options below the bar, and tapping a name
           shows that person's room card in the results area below
           the search. The main view above (Your room / All rooms)
           is never changed by a search. Rebuilding this view (All
           rooms / My room buttons, re-entering the tab) starts
           with empty find results. */
        html += '<div class="findbar"><label for="findInput">Find someone</label>'
          + '<div class="findrow"><input id="findInput" placeholder="Type a name" autocomplete="off" />'
          + '<button class="btn primary" id="findBtn">Find</button></div>'
          + '<p class="find-msg" id="findMsg">Search any of the ' + CAMP_DATA.generalInfo.people.total + ' campers, then tap a name to see their room below.</p>'
          + '<div class="name-list find-list" id="findList"></div></div>'
          + '<div class="find-result" id="findResult"></div>';
        area.innerHTML = html;
        var sa = document.getElementById("seeAllBtn");
        if (sa) sa.addEventListener("click", function(){ state.roomsMode = "all"; state.foundUnit = null; renderRooms(); window.scrollTo({ top:0, behavior:"smooth" }); });
        var bm = document.getElementById("backMineBtn");
        if (bm) bm.addEventListener("click", function(){ state.roomsMode = "default"; renderRooms(); window.scrollTo({ top:0, behavior:"smooth" }); });
        var rp = document.getElementById("roomsPickBtn");
        if (rp) rp.addEventListener("click", openPicker);
        document.getElementById("findBtn").addEventListener("click", doFind);
        document.getElementById("findInput").addEventListener("keydown", function(e){ if (e.key === "Enter") { e.preventDefault(); doFind(); } });
      }
      /* Step 1 of Find: show the matching names as tappable options
         directly below the search bar — never a jump. Matching is
         the gate's: partial and case-insensitive, against display
         and full names. A new search replaces the previous options
         and any room card the last pick opened. */
      function doFind(){
        var input = document.getElementById("findInput");
        var q = (input ? input.value : "").trim().toLowerCase();
        var msg = document.getElementById("findMsg");
        var list = document.getElementById("findList");
        var result = document.getElementById("findResult");
        if (!list || !result) return;
        result.innerHTML = "";
        if (!q) { list.innerHTML = ""; if (msg) msg.textContent = "Type a name first."; return; }
        var hits = PEOPLE.filter(function(p){ return p.display.toLowerCase().indexOf(q) > -1 || p.name.toLowerCase().indexOf(q) > -1; });
        if (!hits.length) {
          list.innerHTML = '<p class="find-msg" style="grid-column:1/-1;margin:3.32px 0">No name found</p>';
          if (msg) msg.textContent = "Try a different spelling.";
          return;
        }
        if (msg) msg.textContent = "Tap a name to see their room below.";
        list.innerHTML = hits.map(function(p){
          return '<button type="button" data-find-display="' + esc(p.display) + '" data-find-unit="' + esc(p.unit) + '">' + esc(p.display) + "</button>";
        }).join("");
        list.querySelectorAll("[data-find-display]").forEach(function(b){
          b.addEventListener("click", function(){
            var p = PEOPLE.filter(function(x){ return x.display === b.getAttribute("data-find-display") && x.unit === b.getAttribute("data-find-unit"); })[0];
            if (!p || !p.room) return;
            showFoundRoom(p);
          });
        });
      }
      /* Step 2 of Find: the tapped person's room card appears in
         the results area below the search bar and options list.
         Nothing above the search changes — the signed-in user's
         own room card and the My room / All rooms state stay
         exactly as they were, and there is no scrolling. */
      function showFoundRoom(p){
        var result = document.getElementById("findResult");
        if (!result) return;
        result.innerHTML = '<h3 class="find-result-h">' + esc(p.display) + " is in " + esc(p.room.unit) + "</h3>" + roomCard(p.room, true);
      }

      /* ================= Rendering: Map =================
         The ORIGINAL WorldMark Angels Camp resort map graphic
         (the map Anthony shared), embedded in the page itself
         as a data URI (RESORT_MAP_IMG below) and shown exactly
         as it is — nothing is redrawn. CLICK-TO-SHOW
         (Anthony, 2026-11-27): the map starts CLEAN; directly
         under it sit the units as SMALL compact cards (a tight
         grid, deliberately small so the map stays on screen
         while tapping) and, below those, the meal locations.
         Tapping a unit card — or a meal row whose host building
         is resolvable — HIGHLIGHTS just that building with a
         soft translucent wash over its own rectangle
         (resortMap.imageRects, % of THIS image), so the
         building and its label stay readable underneath, plus
         ONE small frosted tag just below it (the room number,
         or the meal name). Tapping the same card again clears
         the highlight; tapping another moves it. EVERYTHING IS
         DATA-DRIVEN from the one CAMP_DATA object: a building
         resolves when a room in CAMP_DATA.rooms has a
         roomNumber whose numeric part falls inside that
         building's range (the 1xx range or the same range +
         100) — e.g. P273 -> 273 -> 272-279 -> Bldg P. There
         are NO room pins. A unit or meal whose unit has no
         room number yet is NEVER placed — its building is
         unknowable until the number lands; its card simply
         shows "room number tba" (or the meal row its resolved
         location text) and tapping it selects the card only,
         with no highlight. The full-screen lightbox keeps the
         current highlight. Tapping the map opens it full
         screen, like the reward voucher picture. */
      function buildingForRoomNumber(rn){
        if (!rn) return null;
        var m = String(rn).match(/(\d+)/);
        if (!m) return null;
        var n = parseInt(m[1], 10);
        var B = (CAMP_DATA.resortMap && CAMP_DATA.resortMap.buildings) || {};
        var hit = null;
        Object.keys(B).forEach(function(letter){
          var r = B[letter];
          if ((n >= r[0] && n <= r[1]) || (n >= r[0] + 100 && n <= r[1] + 100)) hit = letter;
        });
        return hit;
      }
      function mapMarkedRooms(){
        var out = [];
        (CAMP_DATA.rooms || []).forEach(function(r){
          if (!r.roomNumber) return;
          var b = buildingForRoomNumber(r.roomNumber);
          if (b) out.push({ room: r, building: b });
        });
        return out;
      }

         building (the room number, or the meal name). */
      var mapSel = null;
      function mapBuildingRect(b){
        var IR = (CAMP_DATA.resortMap && CAMP_DATA.resortMap.imageRects) || {};
        var IP = (CAMP_DATA.resortMap && CAMP_DATA.resortMap.imagePositions) || {};
        var r = IR["Bldg " + b];
        if (r) return r;
        var p = IP["Bldg " + b];
        if (!p) return null;
        return [p[0], p[1], 9.3, 8.0];
      }
      function mapImgHtml(){
        var marks = "";
        if (mapSel && mapSel.building) {
          var r = mapBuildingRect(mapSel.building);
          if (r) {
            marks = '<span class="map-hl" style="left:' + r[0] + '%;top:' + r[1] + '%;width:' + r[2] + '%;height:' + r[3] + '%' + (r[4] ? ';transform:translate(-50%,-50%) rotate(' + r[4] + 'deg)' : '') + '"></span>';
            if (mapSel.tag) {
              var tagX = Math.max(13, Math.min(87, r[0]));
              var tagY = r[1] + (r[5] != null ? r[5] : r[3] / 2 + 0.9);
              marks += '<span class="map-meal-tag" style="left:' + tagX + '%;top:' + tagY + '%">' + esc(mapSel.tag) + '</span>';
            }
          }
        }
        return '<div class="map-img-wrap"><img class="map-img" src="' + RESORT_MAP_IMG + '" alt="Map of the WorldMark Angels Camp resort"><div class="map-marks-layer">' + marks + '</div></div>';
      }
      function mapUnitCardHtml(r){
        var b = r.roomNumber ? buildingForRoomNumber(r.roomNumber) : null;
        var id = "unit:" + r.unit;
        var sel = !!(mapSel && mapSel.id === id);
        return '<button type="button" class="map-unit-card' + (sel ? " is-sel" : "") + '" data-map-sel="' + esc(id) + '" data-map-bldg="' + (b || "") + '" data-map-tag="' + esc(r.roomNumber || "") + '" aria-pressed="' + sel + '">'
          + '<span class="mu-name">' + esc(r.unit) + '</span>'
          + '<span class="mu-room">' + (r.roomNumber ? esc(r.roomNumber) : "room number tba") + '</span></button>';
      }
      /* The Locations rows (the same six places as the Info
         tab, straight from CAMP_DATA.places): each resolves its
         location text through placeLocDisplay, and when the
         place's unit has a room number that resolves to a
         building the row is tappable and highlights that
         building, exactly like a unit card. Places whose unit
         has no room number yet (today: both meetings — Unit 2
         is unnumbered, Parents meeting has no unit) are plain
         info rows, never fake-placed. Meeting places show
         with "room" added (placeDisplayName). */
      function mapMealRows(){
        return (CAMP_DATA.places || []).map(function(pl){
          return { name: placeDisplayName(pl), loc: { unit: pl.unit } };
        });
      }
      function mapMealRowHtml(row){
        var rn = row.loc ? roomNumberForUnit(row.loc.unit) : null;
        var b = rn ? buildingForRoomNumber(rn) : null;
        var text = mealLocDisplay(row.loc || { unit: null });
        var id = "place:" + row.name;
        var sel = !!(mapSel && mapSel.id === id);
        var inner = '<span class="mm-name">' + esc(row.name) + '</span><span class="mm-loc">' + esc(text) + '</span>';
        if (!b) return '<div class="map-meal-row">' + inner + '</div>';
        return '<button type="button" class="map-meal-row' + (sel ? " is-sel" : "") + '" data-map-sel="' + esc(id) + '" data-map-bldg="' + esc(b) + '" data-map-tag="' + esc(row.name) + '" aria-pressed="' + sel + '">' + inner
          + '<span class="mm-hint">' + (sel ? "on map" : "show on map") + '</span></button>';
      }
      function renderMap(){
        var area = document.getElementById("mapArea");
        var mapHtml = mapImgHtml();
        var html = '<div class="resp-sec" style="margin-top:8.3px"><h2>Resort map</h2>'
          + '<p>The resort map for WorldMark Angels Camp. Tap a unit or a place below to highlight it on the map — tap it again to clear.</p></div>'
          + '<div class="map-frame" id="mapFrame" role="button" tabindex="0" aria-label="Resort map — tap to view full screen">' + mapHtml + '</div>'
          + '<p class="map-note">Not to scale &middot; Tap the map to see it bigger.</p>'
          + '<div class="resp-sec"><h2>Our units</h2></div>'
          + '<div class="map-unit-grid">' + (CAMP_DATA.rooms || []).map(mapUnitCardHtml).join("") + '</div>'
          + '<div class="resp-sec"><h2>Locations</h2></div>'
          + '<div class="map-meal-list">' + mapMealRows().map(mapMealRowHtml).join("") + '</div>';
        html += '<div class="lightbox map-lightbox" id="mapLightbox" role="dialog" aria-modal="true" aria-label="Resort map, full screen">'
          + '<button type="button" class="lightbox-close" aria-label="Close full screen map">&times;</button>'
          + '<div class="map-lb-inner">' + mapHtml + '</div></div>';
        area.innerHTML = html;
        var frame = document.getElementById("mapFrame");
        var lb = document.getElementById("mapLightbox");
        function openLb(){ if (lb) lb.classList.add("open"); }
        if (frame) {
          frame.addEventListener("click", openLb);
          frame.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLb(); } });
        }
        if (lb) lb.addEventListener("click", function(){ lb.classList.remove("open"); });
        area.querySelectorAll("[data-map-sel]").forEach(function(el){
          el.addEventListener("click", function(){
            var id = el.getAttribute("data-map-sel");
            if (mapSel && mapSel.id === id) mapSel = null;
            else mapSel = { id: id, building: el.getAttribute("data-map-bldg") || null, tag: el.getAttribute("data-map-tag") || "" };
            renderMap();
          });
        });
      }

      /* ================= Rendering: Info ================= */
      function kv(k, v, small){
        return '<div class="kv"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + (small ? "<small>" + esc(small) + "</small>" : "") + "</span></div>";
      }
      function renderInfo(){
        var G = CAMP_DATA.generalInfo, M = CAMP_DATA.meta;
        var p = G.people;
        var peopleRows = kv("Total", p.total + " people");
        if (p.adults != null) peopleRows += kv("Adults", String(p.adults));
        else peopleRows += kv("Adults", "approx " + p.adultsApproxFromSheet, "exact split coming on the sheet");
        if (p.youths != null) peopleRows += kv("Youths", String(p.youths));
        if (p.children != null) peopleRows += kv("Children", String(p.children));
        if (p.youths == null && p.children == null) peopleRows += kv("Youths & children", "approx " + p.youthsChildrenApproxFromSheet, "combined for now — split coming later");
        var roomNums = CAMP_DATA.rooms.map(function(r){
          return kv(r.unit + " · " + r.type, r.roomNumber ? "Room " + r.roomNumber : "room number tba");
        }).join("");
        /* Locations (Anthony, 2026-11-27): ONE section for every
           place — the two meeting places first, then the meal
           places — rendered straight from CAMP_DATA.places, each
           value resolved unit -> room number through
           placeLocDisplay ("Room <number>", "room number tba"
           when a unit is assigned but has no room number yet, or
           "no unit"). Meeting places show with "room" added
           (placeDisplayName). Unit numbers are never shown
           here, and the rows fill themselves in as room numbers
           land. */
        var locRows = (CAMP_DATA.places || []).map(function(pl){
          return kv(placeDisplayName(pl), placeLocDisplay(pl));
        }).join("");
        var cars = CAMP_DATA.cars.map(function(c){
          return '<li><span class="drv">' + esc(c.driver) + '</span><span class="car">' + esc(c.car || "Car TBA") + "</span></li>";
        }).join("");
        /* Every Info card is collapsible (Anthony, 2026-11-27):
           COLLAPSED by default — header (title + chevron) only;
           tapping the header expands the body in place, tapping
           again collapses it. Open state lives in state.infoOpen
           (session-only) and is reapplied on every render. */
        function infoCard(key, title, body){
          var open = !!state.infoOpen[key];
          return '<div class="info-card' + (open ? " is-open" : "") + '">'
            + '<h2><button type="button" class="info-card-head" data-info-toggle="' + key + '" aria-expanded="' + open + '">'
            + '<span class="info-card-title">' + title + '</span>'
            + '<span class="info-chev" aria-hidden="true">' + CHEVRON_SVG + "</span></button></h2>"
            + '<div class="info-card-body"' + (open ? "" : " hidden") + ">" + body + "</div></div>";
        }
        document.getElementById("infoArea").innerHTML =
          '<div class="info-grid">'
          + infoCard("keytimes", "Key times",
              kv("Arrive — Friday Nov 27", G.arrivalTimeFriday)
              + kv("Check-in & settle — Friday", G.checkInFriday)
              + kv("Check-out — Sunday Nov 29", G.checkOutSunday)
              + kv("Get ready to leave — Sunday", G.getReadyToLeaveSunday)
              + kv("Leave — Sunday", G.leaveTimeSunday)
              + kv("Afterwards", "12:00 PM", G.sundayAfterLeave))
          + infoCard("people", "People", peopleRows
              + kv("Units", G.unitsCount + " units")
              + kv("Drivers / cars listed", String(G.driversCarsListed)))
          + infoCard("locations", "Locations", locRows)
          + infoCard("rooms", "Room numbers", roomNums)
          + infoCard("cars", "Drivers &amp; cars (" + CAMP_DATA.cars.length + ")", '<ul class="car-list">' + cars + "</ul>")
          + "</div>";
        document.querySelectorAll("#infoArea [data-info-toggle]").forEach(function(btn){
          btn.addEventListener("click", function(){
            var key = btn.getAttribute("data-info-toggle");
            var open = !state.infoOpen[key];
            state.infoOpen[key] = open;
            var card = btn.closest(".info-card");
            if (card) card.classList.toggle("is-open", open);
            btn.setAttribute("aria-expanded", String(open));
            var body = card ? card.querySelector(".info-card-body") : null;
            if (body) body.hidden = !open;
          });
        });
      }

      /* ================= Navigation ================= */
      var VIEWS = ["schedule", "assign", "comp", "race", "tracker", "rooms", "map", "info"];
      function showView(v){
        if (!state.user) { applyGate(); openPicker(); return; }
        if (VIEWS.indexOf(v) === -1) v = "schedule";
        /* Children never land on Competition — fall back to Schedule. */
        if (v === "comp" && state.user.category === "Children") v = "schedule";
        /* The Voting Tracker tab exists only while
           trackerTabAvailable(); a stale request for it falls
           back like the reset conventions: Competition in the
           after phase, Schedule otherwise. */
        if (v === "tracker" && !trackerTabAvailable()) v = compPhase() === "after" ? "comp" : "schedule";
        if (v === "schedule") state.day = defaultDayStr();
        state.view = v;
        VIEWS.forEach(function(name){
          var viewEl = document.getElementById("view-" + name);
          var tabEl = document.getElementById("tab-" + name);
          if (viewEl) viewEl.hidden = name !== v;
          if (tabEl) tabEl.setAttribute("aria-selected", String(name === v));
        });
        if (v === "schedule") renderSchedule();
        if (v === "assign") renderAssignments();
        if (v === "comp") renderCompetition();
        if (v === "race") renderRace();
        if (v === "tracker") renderTracker();
        if (v === "rooms") renderRooms();
        if (v === "map") renderMap();
        if (v === "info") renderInfo();
        syncTrackerTab();
        if (v === "schedule") {
          /* renderSchedule already queued the auto-scroll to the
             Current activity (or the Up next card when the day
             hasn't started); only fall back to the top when the
             shown day has neither — e.g. the camp-over state. */
          var hasHighlight = !!document.querySelector("#scheduleArea .ev.is-current-filled") || !!document.querySelector("#scheduleArea .ev.is-upnext");
          if (!hasHighlight) window.scrollTo({ top: 0, behavior: "smooth" });
        } else {
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      }
      function bindEventButtons(root){ /* schedule rows are display-only; tabs are the navigation */ }
      function syncTrackButtons(){
        document.querySelectorAll("[data-track]").forEach(function(b){
          b.setAttribute("aria-pressed", String(b.getAttribute("data-track") === state.track));
        });
      }
      /* Full reset when the picked person changes (including first pick):
         behave as if the page was freshly opened for the new person. */
      function resetForNewUser(p){
        pendingUser = null;
        saveUser(p);
        state.day = defaultDayStr();
        state.selected = null;
        state.track = defaultTrackFor(p);
        saveTrack(state.track);
        state.roomsMode = "default";
        state.groupsOpen = false;
        state.raceOpen = false;
        state.otherTeamsOpen = false;
        state.mealOpen = {};
        state.allMealsOpen = false;
        state.infoOpen = {};
        state.foundUnit = null;
        state.foundName = null;
        var searchEl = document.getElementById("pickerSearch");
        if (searchEl) searchEl.value = "";
        clearPickerResults();
        var findEl = document.getElementById("findInput");
        if (findEl) findEl.value = "";
        closePicker();
        syncTrackButtons();
        renderHeader();
        showView("schedule");
        /* No scroll-to-top here: showView/renderSchedule handle it —
           auto-scroll to Current when there is one, top otherwise. */
      }
      function refreshAll(){
        renderHeader();
        syncTrackerTab();
        if (state.view === "schedule") renderSchedule();
        if (state.view === "assign") renderAssignments();
        if (state.view === "comp") renderCompetition();
        if (state.view === "race") renderRace();
        if (state.view === "tracker") renderTracker();
        if (state.view === "rooms") renderRooms();
        if (state.view === "map") renderMap();
        if (state.view === "info") renderInfo();
      }

      document.querySelectorAll(".tabbar button").forEach(function(b){
        b.addEventListener("click", function(){ showView(b.getAttribute("data-view")); });
      });
      document.querySelectorAll("[data-track]").forEach(function(b){
        b.addEventListener("click", function(){
          state.track = b.getAttribute("data-track");
          saveTrack(state.track);
          syncTrackButtons();
          if (state.view === "schedule") renderSchedule();
        });
      });

      /* ================= Init ================= */
      state.user = loadUser();
      state.day = defaultDayStr();
      state.track = loadTrack() || defaultTrackFor(state.user);
      renderHeader();
      applyGate();
      if (state.user) renderSchedule();
      syncTrackButtons();
      if (!state.user) openPicker();
      setInterval(function(){ if (state.user && state.view === "schedule") renderSchedule(); }, 30000);
      /* Competition clock: every second, refresh the flashing tab
         state and the countdown; when the phase flips (into or out
         of the 4:30–5:30 PM window), re-render the Competition tab
         if it is open so the timer / scoring / done states land
         without a manual refresh. */
      var lastCompPhase = compPhase();
      var lastRaceLive = raceLive();
      var lastRaceRevealed = raceRevealed();
      setInterval(function(){
        updateCompTab();
        updateRaceTab();
        /* Keeps the Voting Tracker tab's existence current:
           it appears the moment the after phase begins (for a
           tracker viewer, state still open) and vanishes when
           the feed flips to final, whoever's tab is showing. */
        if (state.user) syncTrackerTab();
        var ph = compPhase();
        if (ph !== lastCompPhase) {
          lastCompPhase = ph;
          if (state.user && state.view === "comp") renderCompetition();
          else if (state.user && state.view === "tracker") renderTracker();
          return;
        }
        var rl = raceLive();
        if (rl !== lastRaceLive) {
          lastRaceLive = rl;
          if (state.user && state.view === "race") renderRace();
        }
        /* Reveal flip (Saturday 1:00 PM): the groupings land on
           whichever view is open — Race tab, Assignments, or the
           Schedule (whose race bubble appears) — with no manual
           refresh. */
        var rv = raceRevealed();
        if (rv !== lastRaceRevealed) {
          lastRaceRevealed = rv;
          if (state.user && state.view === "race") renderRace();
          else if (state.user && state.view === "assign") renderAssignments();
          else if (state.user && state.view === "schedule") renderSchedule();
        }
        if (ph === "during") {
          var tEl = document.getElementById("compTimer");
          if (tEl) tEl.textContent = fmtCountdown(compRemainingSeconds());
        }
        if (rl) setCdSegs("raceRem", raceRemainingSeconds(), false);
        /* Countdown-to-start ticking: its segment blocks are
           present on the Race tab from before the reveal through
           the 1:00–2:00 PM hour. */
        setCdSegs("raceCd", raceStartsInSeconds(), true);
      }, 1000);
      /* Final results polling: in the after phase, while the
         Competition or Voting Tracker tab is the active tab and
         the page is visible, check the results sheet about every
         20 seconds (renderCompetition / renderTracker also fetch
         once on entering the phase / switching to the tab). When
         the sheet's State flips to "final", fetchCompResults
         re-renders the Competition tab into the Final Results
         board automatically — and a user sitting on the Tracker
         tab is switched over to it as that tab disappears. */
      setInterval(function(){
        if (compPhase() !== "after") return;
        if (!state.user || (state.view !== "comp" && state.view !== "tracker")) return;
        if (typeof document.hidden === "boolean" && document.hidden) return;
        fetchCompResults();
        if (canViewTracker()) fetchTrackerResponses();
      }, 20000);
    })();
    </script>
  </body>
</html>
